<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page around the mockup */
  :root { --page: #0e0f12; --page-text: #c9ced8; --page-muted: #7d8492; --page-line: #2a2e36; --page-on: #3b82f6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--page-text); font: 13px/1.4 system-ui, sans-serif; }
  .controls { height: 84px; display: flex; align-items: center; align-content: center; gap: 6px 16px; padding: 0 16px; border-bottom: 1px solid var(--page-line); flex-wrap: wrap; }
  .controls b { font-weight: 600; }
  .seg { display: flex; gap: 4px; align-items: center; }
  .seg span { color: var(--page-muted); margin-right: 4px; }
  .seg button { font: inherit; color: var(--page-text); background: transparent; border: 1px solid var(--page-line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .seg button.on { background: var(--page-on); border-color: var(--page-on); color: #fff; }
  .caption { color: var(--page-muted); flex: 1 0 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage { position: absolute; top: 84px; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-start; justify-content: center; padding: 12px; overflow: hidden; }
  .frame { width: 1440px; height: 900px; transform-origin: top center; box-shadow: 0 8px 40px rgba(0, 0, 0, .5); flex-shrink: 0; }

  /* The editor. Design tokens per direction. */
  .ed {
    --app: #16191e; --panel: #21252c; --field: #191c22; --hover: #2b3039; --line: #323843;
    --text: #d5dbe5; --muted: #8a93a3; --faint: #5d6574;
    --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .24); --on-accent: #ffffff;
    --warning: #e5b931; --tip: #5aa9f0; --danger: #e5534b; --playing: #3fb27f; --paused: #e5b931;
    --radius: 4px; --row: 28px; --text-size: 12px;
    --font-ui: "JetBrains Mono", ui-monospace, monospace; --font-num: "JetBrains Mono", ui-monospace, monospace;
    position: relative; width: 1440px; height: 900px; overflow: hidden;
    background: var(--app); color: var(--text); font-family: var(--font-ui); font-size: var(--text-size);
  }
  .ed svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .num { font-family: var(--font-num); }

  .top { position: absolute; left: 0; top: 0; right: 0; height: 44px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 8px; gap: 4px; z-index: 3; }
  .top .grow { flex: 1; }
  .ib { height: 28px; min-width: 28px; padding: 0 6px; border-radius: var(--radius); display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }
  .ib.hover { background: var(--hover); }
  .ib.dim { color: var(--faint); }
  .ib.on { background: var(--accent-soft); color: var(--text); }
  .ib .chev { width: 12px; height: 12px; color: var(--muted); }
  .levelname { padding: 0 8px; height: 28px; display: flex; align-items: center; font-weight: 500; }
  .savestate { color: var(--muted); display: flex; align-items: center; gap: 4px; padding-right: 8px; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .play { height: 28px; padding: 0 12px; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; margin: 0 6px; }
  .play svg.i { fill: currentColor; stroke: none; width: 12px; height: 12px; }

  .view { position: absolute; left: 0; top: 44px; right: 0; bottom: 24px; }
  .view svg { display: block; }

  .tools { position: absolute; left: 0; top: 44px; bottom: 24px; width: 44px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 4px; z-index: 2; }
  .tool { width: 32px; height: 32px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text); position: relative; }
  .tool.on { background: var(--accent); color: var(--on-accent); }
  .tool.hover { background: var(--hover); }
  .tip-box { position: absolute; left: 40px; top: 4px; white-space: nowrap; background: #0b0d10; color: #e8ebf0; border-radius: var(--radius); padding: 4px 8px; font-size: 11px; display: flex; gap: 10px; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .tip-box .k { color: #8a93a3; }

  .panel { position: absolute; top: 44px; bottom: 24px; background: var(--panel); z-index: 2; display: flex; flex-direction: column; }
  .entities { right: 0; width: 260px; border-left: 1px solid var(--line); }
  .insp { left: 44px; width: 300px; border-right: 1px solid var(--line); overflow: hidden; }
  .ph { height: 36px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; border-bottom: 1px solid var(--line); flex-shrink: 0; }

  .lrow { height: var(--row); display: flex; align-items: center; gap: 6px; padding-right: 8px; color: var(--text); }
  .lrow .fold { width: 14px; height: 14px; color: var(--muted); }
  .lrow .kind { color: var(--muted); }
  .lrow .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .eye { color: var(--faint); }
  .lrow.sel { background: var(--accent-soft); }
  .lrow.sel .kind { color: var(--text); }
  .lrow.hover { background: var(--hover); }
  .lrow.hover .eye { color: var(--muted); }

  .ihead { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .ihead .nm { flex: 1; height: 26px; display: flex; align-items: center; padding: 0 6px; border-radius: var(--radius); background: var(--field); font-weight: 500; }
  .ihead .nm.plain { background: none; padding: 0; }
  .card { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .chead { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; font-weight: 600; }
  .chead .t { flex: 1; }
  .chead svg.i { width: 14px; height: 14px; color: var(--muted); }
  .f { height: var(--row); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .f > label { width: 128px; color: var(--muted); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f.off > label, .f.off .inp { color: var(--faint); }
  .f .vals { flex: 1; display: flex; gap: 6px; min-width: 0; align-items: center; }
  .inp { flex: 1; min-width: 0; height: 22px; background: var(--field); border: 1px solid transparent; border-radius: var(--radius); padding: 0 6px; display: flex; align-items: center; gap: 4px; font-family: var(--font-num); white-space: nowrap; overflow: hidden; }
  .inp.ro { background: transparent; padding-left: 0; }
  .inp.focus { border-color: var(--accent); }
  .inp .ax { color: var(--muted); }
  .inp .unit { color: var(--muted); opacity: .75; margin-left: auto; }
  .inp .chev { margin-left: auto; width: 12px; height: 12px; color: var(--muted); }
  .inp.short { flex: 0 0 58px; }
  .slider { flex: 1; height: 3px; background: var(--line); border-radius: 2px; position: relative; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); border-radius: 2px; }
  .slider b { position: absolute; top: -4px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: var(--text); }
  .cb { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .cb.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .cb.on svg.i { width: 11px; height: 11px; stroke-width: 2.4; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); flex-shrink: 0; }
  .addc { margin: 12px; height: 28px; border: 1px solid var(--line); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }

  .status { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 20px; padding: 0 10px; color: var(--muted); font-size: 11px; z-index: 3; }
  .status .hint { flex: 1; color: var(--text); }
  .status .warn { display: flex; align-items: center; gap: 4px; }
  .status svg.i { width: 13px; height: 13px; }

  .opts { position: absolute; left: 352px; top: 52px; z-index: 2; display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .opts .ib { gap: 6px; padding: 0 8px; }

  .menu { position: absolute; z-index: 6; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 4px; }
  .mi { height: 26px; display: flex; align-items: center; padding: 0 8px; border-radius: 3px; gap: 12px; }
  .mi .l { flex: 1; }
  .mi .k { color: var(--muted); font-family: var(--font-num); font-size: 11px; }
  .mi.hover { background: var(--accent); color: var(--on-accent); }
  .mi.hover .k { color: var(--on-accent); opacity: .8; }
  .mi.dis { color: var(--faint); }
  .mi.dis .k { color: var(--faint); }
  .mi .chev { width: 12px; height: 12px; }
  .msep { height: 1px; background: var(--line); margin: 4px 6px; }

  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 7; }
  .dialog { position: absolute; z-index: 8; left: 50%; top: 260px; width: 400px; margin-left: -200px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .dialog h3 { margin: 0; padding: 16px 16px 6px; font-size: 13px; font-weight: 600; }
  .dialog p { margin: 0; padding: 0 16px 16px; color: var(--muted); line-height: 1.5; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { height: 28px; padding: 0 14px; border-radius: var(--radius); display: inline-flex; align-items: center; border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  .sheet { position: absolute; inset: 0; background: var(--app); padding: 20px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: min-content; gap: 14px; overflow: hidden; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding-bottom: 8px; }
  .box h4 { margin: 0; padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .box .line { display: flex; align-items: center; gap: 8px; padding: 4px 12px; flex-wrap: wrap; }
  .box .cap { color: var(--faint); font-size: 11px; width: 100%; padding: 0 12px; }
  .inp.err { border-color: var(--danger); }
  .msg { padding: 0 12px 4px 148px; font-size: 11px; color: var(--muted); }
  .msg.err { color: var(--danger); }
  .note { margin: 4px 12px; padding: 6px 8px; border-radius: var(--radius); background: var(--field); display: flex; gap: 8px; align-items: flex-start; line-height: 1.45; }
  .note .fix { color: var(--accent); white-space: nowrap; }
  .dropline { height: 2px; background: var(--accent); margin-left: 40px; position: relative; }
  .dropline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); box-sizing: border-box; }
  .ib.dis { color: var(--faint); }
  .btn.dis { color: var(--faint); }
  .tool.locked::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--on-accent); }
  .tip-box.static { position: static; display: inline-flex; }
  .playbar.static { position: static; transform: none; display: inline-flex; box-shadow: none; }
  .playbar.paused { border-color: var(--paused); }
  .playbar.paused .state { color: var(--paused); }
  .playbar.paused .state i { background: var(--paused); }
  .mini svg { display: block; border-radius: 3px; }
  .game { position: absolute; inset: 0; background: #000; }
  .playbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 4px; padding: 4px; background: var(--panel); border: 1.5px solid var(--playing); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .playbar .state { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; font-weight: 600; color: var(--playing); letter-spacing: .04em; }
  .playbar .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--playing); }
  .playbar .ib { padding: 0 8px; }
  .playbar .k { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<div class="controls">
  <b>Editor mockups · v1</b>
  <div class="seg" id="moments"><span>Moment</span></div>
  <div class="caption" id="caption"></div>
</div>
<div class="stage" id="stage"><div class="frame" id="frame"></div></div>
<script>
// Outline icons, drawn for this mockup in the style of an open icon set.
const ICON = {
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  select: '<path d="M6 3l12 8-5.5 1.5L10 19z"/>',
  shape: '<rect x="3" y="3" width="10" height="10" rx="1"/><circle cx="15.5" cy="15.5" r="5.5"/>',
  joint: '<circle cx="7" cy="17" r="3"/><circle cx="17" cy="7" r="3"/><path d="M9.2 14.8l5.6-5.6"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>',
  magnet: '<path d="M6 4v7a6 6 0 0 0 12 0V4"/><path d="M6 8h4M14 8h4M10 4v4M14 4v4"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  step: '<path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="1"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.8-2.5 2-2.5 4"/><path d="M12 17h.01"/>',
  world: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  camera: '<rect x="3" y="7" width="13" height="10" rx="1"/><path d="M16 10.5l5-3v9l-5-3"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
  circle: '<circle cx="12" cy="12" r="8"/>',
  polygon: '<path d="M12 3l9 7-3.5 10h-11L3 10z"/>',
  line: '<path d="M3 18l6-8 5 4 7-9"/>',
  group: '<path d="M3 6.5h6l2 2h10V19H3z"/>',
  warning: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  dots: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',
  saved: '<path d="M5 12l5 5 9-10"/>',
  eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  target: '<circle cx="12" cy="12" r="8"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>'
};
const ic = (name, extra = '') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${ICON[name]}</svg>`;

// The sample level, in level pixels. The origin is the middle of the level, y points down.
const BG = '#cde3f2';
const LEVEL = [
  { id: 'ground', t: 'rect', x: -1100, y: 380, w: 2200, h: 260, fill: '#6ba368', line: '#2f5130' },
  { id: 'ramp', t: 'poly', p: [[-1000, 380], [-560, 380], [-1000, 170]], fill: '#7db37a', line: '#2f5130' },
  { id: 'platform', t: 'rect', x: 250, y: 60, w: 420, h: 40, fill: '#8a6b4e', line: '#4a3626' },
  { id: 'crate1', t: 'rect', x: 290, y: -40, w: 100, h: 100, fill: '#c68b4e', line: '#6b4423' },
  { id: 'crate2', t: 'rect', x: 410, y: -40, w: 100, h: 100, fill: '#c68b4e', line: '#6b4423' },
  { id: 'crate3', t: 'rect', x: 350, y: -140, w: 100, h: 100, fill: '#c68b4e', line: '#6b4423' },
  { id: 'ball', t: 'circle', cx: 140, cy: 180, r: 40, fill: '#f0c419', line: '#8a6d00' },
  { id: 'carbody', t: 'rect', x: -440, y: 250, w: 320, h: 60, fill: '#d9534f', line: '#7a2522' },
  { id: 'cabin', t: 'poly', p: [[-380, 250], [-340, 190], [-230, 190], [-190, 250]], fill: '#e8807c', line: '#7a2522' },
  { id: 'wheel1', t: 'circle', cx: -370, cy: 338, r: 42, fill: '#3a3a3a', line: '#111111' },
  { id: 'wheel2', t: 'circle', cx: -190, cy: 338, r: 42, fill: '#3a3a3a', line: '#111111' },
  { id: 'rect1', t: 'rect', x: -60, y: 300, w: 160, h: 80, fill: '#4a90d9', line: '#1f3552' }
];
const HINGES = [[-370, 338], [-190, 338]];

// Where things are during test play, a moment after Play.
const PLAYED = {
  crate3: { dx: 320, dy: 60, rot: 28 }, ball: { dy: 100 }, carbody: { dx: 50 }, cabin: { dx: 50 },
  wheel1: { dx: 50 }, wheel2: { dx: 50 }
};

function drawShape(s, X, Y, z, opts) {
  const sw = Math.max(0.6, 2 * z);
  const style = `fill="${s.fill}" stroke="${s.line}" stroke-width="${sw}" stroke-linejoin="round"`;
  const move = opts.play && PLAYED[s.id] || {};
  const dx = (move.dx || 0), dy = (move.dy || 0);
  let out = '';
  if (s.t === 'rect') {
    const [x, y] = [X(s.x + dx), Y(s.y + dy)];
    const cx = x + s.w * z / 2, cy = y + s.h * z / 2;
    out = `<rect x="${x}" y="${y}" width="${s.w * z}" height="${s.h * z}" ${style} transform="rotate(${move.rot || 0} ${cx} ${cy})"/>`;
  } else if (s.t === 'circle') {
    out = `<circle cx="${X(s.cx + dx)}" cy="${Y(s.cy + dy)}" r="${s.r * z}" ${style}/>`;
  } else {
    out = `<polygon points="${s.p.map(([a, b]) => X(a + dx) + ',' + Y(b + dy)).join(' ')}" ${style}/>`;
  }
  return out;
}

// One SVG of the level view. Overlays are drawn in screen pixels, so they keep their size at any zoom.
function scene(w, h, z, cx, cy, opts) {
  const X = (x) => +(cx + x * z).toFixed(2), Y = (y) => +(cy + y * z).toFixed(2);
  const acc = 'var(--accent)';
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s += `<rect width="${w}" height="${h}" fill="${BG}"/>`;
  if (opts.grid) {
    const step = 50 * z;
    const ox = ((cx % step) + step) % step, oy = ((cy % step) + step) % step;
    s += `<defs><pattern id="g" width="${step}" height="${step}" patternUnits="userSpaceOnUse" x="${ox}" y="${oy}"><path d="M ${step} 0 L 0 0 0 ${step}" fill="none" stroke="rgba(30,60,95,.13)" stroke-width="1"/></pattern></defs>`;
    s += `<rect width="${w}" height="${h}" fill="url(#g)"/>`;
    s += `<path d="M ${cx} 0 V ${h} M 0 ${cy} H ${w}" stroke="rgba(30,60,95,.32)" stroke-width="1"/>`;
  }
  for (const shape of (opts.empty ? [] : LEVEL)) s += drawShape(shape, X, Y, z, opts);
  if (opts.joints && !opts.empty) {
    for (const [a, b] of HINGES) {
      s += `<circle cx="${X(a)}" cy="${Y(b)}" r="7" fill="#fff" stroke="#1d2430" stroke-width="1.5"/><circle cx="${X(a)}" cy="${Y(b)}" r="2" fill="#1d2430"/>`;
    }
  }
  if (opts.cameraFrame) {
    s += `<rect x="${X(-960)}" y="${Y(-540)}" width="${1920 * z}" height="${1080 * z}" fill="none" stroke="rgba(20,28,40,.7)" stroke-width="1.5"/>`;
    s += `<text x="${X(-960)}" y="${Y(-540) - 6}" font-size="11" fill="rgba(20,28,40,.8)" font-family="var(--font-ui)">Camera 1920 × 1080</text>`;
  }
  if (opts.selected) {
    const r = LEVEL.find((e) => e.id === opts.selected);
    const x = X(r.x), y = Y(r.y), rw = r.w * z, rh = r.h * z;
    s += `<rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="none" stroke="${acc}" stroke-width="1.5"/>`;
    for (const [hx, hy] of [[0, 0], [.5, 0], [1, 0], [0, .5], [1, .5], [0, 1], [.5, 1], [1, 1]]) {
      s += `<rect x="${x + hx * rw - 4}" y="${y + hy * rh - 4}" width="8" height="8" fill="#fff" stroke="${acc}" stroke-width="1.5"/>`;
    }
  }
  if (opts.drawing) {
    const pts = [[-760, -250], [-560, -390], [-330, -300], [-380, -90]];
    const mouse = [-640, -40];
    const all = pts.concat([mouse]);
    s += `<polygon points="${all.map(([a, b]) => X(a) + ',' + Y(b)).join(' ')}" fill="#4a90d9" fill-opacity=".35" stroke="none"/>`;
    s += `<polyline points="${pts.map(([a, b]) => X(a) + ',' + Y(b)).join(' ')}" fill="none" stroke="#1f3552" stroke-width="1.5"/>`;
    s += `<polyline points="${X(pts[3][0])},${Y(pts[3][1])} ${X(mouse[0])},${Y(mouse[1])} ${X(pts[0][0])},${Y(pts[0][1])}" fill="none" stroke="#1f3552" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    pts.forEach(([a, b], i) => {
      s += i === 0
        ? `<circle cx="${X(a)}" cy="${Y(b)}" r="6" fill="#fff" stroke="${acc}" stroke-width="2"/>`
        : `<rect x="${X(a) - 4}" y="${Y(b) - 4}" width="8" height="8" fill="#fff" stroke="${acc}" stroke-width="1.5"/>`;
    });
    const [mx, my] = [X(mouse[0]), Y(mouse[1])];
    s += `<path d="M ${mx - 9} ${my} H ${mx + 9} M ${mx} ${my - 9} V ${my + 9}" stroke="#0b0d10" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
}

];
function entities(rows, selected, hover) {
  let s = `<div class="panel entities"><div class="ph">Entities</div><div>`;
  for (const [d, icon, name, fold] of rows) {
    const state = name === selected ? ' sel' : name === hover ? ' hover' : '';
    const arrow = fold ? ic(fold === 'open' ? 'down' : 'right', 'style="width:14px;height:14px;color:var(--muted)"') : '<span style="width:16px"></span>';
    const eye = name === 'World' ? '' : `<span class="eye">${ic('eye')}</span>`;
    s += `<div class="lrow${state}" style="padding-left:${8 + d * 16}px">${arrow}<span class="kind">${ic(icon)}</span><span class="name">${name}</span>${eye}</div>`;
  }
  return s + '</div></div>';
}

      `<div class="f"><label>Follow</label><div class="vals"><div class="inp">${ic('rect', 'style="width:13px;height:13px;color:var(--muted)"')}Car${ic('target', 'class="i chev"')}</div></div></div>` +
      `<div class="f"><label>A</label><div class="vals"><div class="inp" style="color:var(--warning)">${ic('warning', 'style="width:13px;height:13px"')}missing entity</div></div></div>`)}
    ${box('Play bar', `<div class="line"><span class="playbar static"><span class="state"><i></i>PLAYING</span><span class="ib">${ic('pause')}Pause</span><span class="ib dim">${ic('step')}Step</span><span class="ib">${ic('stop')}Stop</span></span></div>
      <div class="line"><span class="playbar static paused"><span class="state"><i></i>PAUSED</span><span class="ib">${ic('play')}Resume</span><span class="ib">${ic('step')}Step</span><span class="ib">${ic('stop')}Stop</span></span></div><div class="cap">Running, and paused with Step enabled</div>`)}
    <div class="box" style="grid-column: span 4"><h4>The level view's overlays</h4><div class="line mini" style="gap:14px">${OVERLAYS.map(([cap, svg]) => `<div>${svg}<div class="cap" style="padding:4px 0 0">${cap}</div></div>`).join('')}</div></div>
  </div>`;
}
MOMENTS.push(['6', 'States', 'Every control in each state, and how the level view draws selections and its other overlays. Some states are Claude\'s proposals, not shown in the moments: see docs/design/controls.md.', () => statesSheet()]);

let moment = '1';
try { const saved = JSON.parse(localStorage.getItem('engine-v3-mockups') || '{}'); moment = saved.moment || moment; } catch (e) {}
// A link such as index.html#3 opens moment 3.
if (location.hash.length > 1) moment = location.hash.slice(1);

function render() {
  const m = MOMENTS.find((x) => x[0] === moment) || MOMENTS[0];
  document.getElementById('frame').innerHTML = `<div class="ed">${m[3]()}</div>`;
  document.getElementById('caption').textContent = m[2];
  for (const b of document.querySelectorAll('#moments button')) b.classList.toggle('on', b.dataset.v === moment);
  try { localStorage.setItem('engine-v3-mockups', JSON.stringify({ moment })); } catch (e) {}
  fit();
}
function fit() {
  const stage = document.getElementById('stage');
  const k = Math.min((stage.clientWidth - 24) / 1440, (stage.clientHeight - 24) / 900, 1);
  const frame = document.getElementById('frame');
  frame.style.transform = `scale(${k})`;
  frame.style.marginBottom = `${-900 * (1 - k)}px`;
}
for (const [v, label] of MOMENTS) {
  const b = document.createElement('button'); b.textContent = `${v} ${label}`; b.dataset.v = v;
  b.onclick = () => { moment = v; render(); }; document.getElementById('moments').appendChild(b);
}
document.addEventListener('keydown', (e) => {
  const i = MOMENTS.findIndex((x) => x[0] === moment);
  if (e.key === 'ArrowRight') { moment = MOMENTS[Math.min(i + 1, MOMENTS.length - 1)][0]; render(); }
  if (e.key === 'ArrowLeft') { moment = MOMENTS[Math.max(i - 1, 0)][0]; render(); }
});
window.addEventListener('resize', fit);
render();
</script>
</body>
