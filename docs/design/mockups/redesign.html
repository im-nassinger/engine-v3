<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page around the mockups */
  :root { --page: #0b0c0e; --page-2: #17181c; --page-3: #222329; --page-text: #d4d7dd; --page-muted: #80858f; --page-on: #eceef2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--page-text); font: 12px/1.4 "JetBrains Mono", ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  .hdr { padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .hrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hrow > .lbl { color: var(--page-muted); width: 72px; flex-shrink: 0; }
  .pick { font: inherit; color: var(--page-text); background: var(--page-2); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .pick:hover { background: var(--page-3); }
  .pick.on { background: var(--page-on); color: #111; }
  .stage { flex: 1; position: relative; overflow: hidden; }
  .stage.scroll { overflow-y: auto; }
  .frame { position: absolute; left: 50%; top: 8px; width: 1440px; margin-left: -720px; transform-origin: top center; border-radius: 10px; overflow: hidden; }

  /* The editor. Its tokens are set per direction on .ed. */
  .ed { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--app); color: var(--text); font-family: var(--font-ui); font-size: var(--fs);
    --warning: #e5b931; --tip: #5aa9f0; --danger: #e5534b; --playing: #3fb27f; --save: #2fa866; --save-ink: #6fd89d; --paused: #e5b931; --tooltip: #0b0d10; --tooltip-text: #e8ebf0; }
  .ed.tall { height: auto; }
  .ed svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .num { font-family: var(--font-num); }
  .abs { position: absolute; }
  .blk { background: var(--panel); }
  .bar { background: var(--bar); }
  .float .blk, .isl { border-radius: var(--rl); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .isl { background: var(--panel); display: flex; align-items: center; gap: 2px; padding: 0 7px; height: 44px; }
  .viewbox { overflow: hidden; }
  .viewbox svg { display: block; }


  /* Every grey container of the editor (islands, panels, the minimap, the debug box, menus, dialogs, the Play bar) has
     the class shade, and this is its only style: a solid 2 px dark edge under it. */
  .ed .shade { box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }

  /* The top bar */
  .top { display: flex; align-items: center; gap: 4px; padding: 0 8px; z-index: 3; }
  .float-top { background: none; padding: 0; display: flex; justify-content: space-between; }
  .isl .play { margin-right: 6px; }
  .grow { flex: 1; }
  .ib { height: 28px; min-width: 28px; padding: 0 6px; border-radius: var(--r); display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }
  .ib.hover { background: var(--hover); }
  .ib.dim { color: var(--faint); }
  .ib.on { background: var(--soft); color: var(--ink); }
  .ib .chev { width: 12px; height: 12px; color: var(--muted); }
  .levelname { padding: 0 8px; height: 28px; display: flex; align-items: center; font-weight: 500; }
  .savestate { color: var(--muted); display: flex; align-items: center; gap: 4px; padding-right: 6px; }
  .sep { width: 8px; }
  .play { height: 30px; padding: 0 16px; border-radius: var(--r); background: var(--grad); color: var(--on); display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .play svg.i { fill: currentColor; stroke: none; width: 12px; height: 12px; }
  .play.pill, .btn.pill { border-radius: 999px; }

  /* The toolbar strip */
  .tools { display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; z-index: 2; }
  .tools.h { flex-direction: row; padding: 6px; display: inline-flex; position: static; border-radius: var(--r2); }
  .tools.row { flex-direction: row; justify-content: center; padding: 0 7px; }
  .isl .tool { width: 30px; height: 30px; }
  .tool { width: 32px; height: 32px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; position: relative; color: var(--muted); }
  .tool.hover { background: var(--hover); color: var(--text); }
  .tool.on.fill { background: var(--accent); color: var(--on); }
  .tool.on.soft { background: var(--soft); color: var(--ink); }
  .tip-box { white-space: nowrap; background: var(--tooltip); color: var(--tooltip-text); border-radius: var(--r); padding: 5px 9px; font-size: 12px; display: inline-flex; gap: 10px; }
  .tip-box .k { color: #8a93a3; }

  .onebar .grow { flex: 1; }
  .cnums .warn, .barnums .warn { display: flex; align-items: center; gap: 4px; }
  .cnums svg.i, .barnums svg.i { width: 13px; height: 13px; }
  .hintchip { position: absolute; transform: translateX(-50%); z-index: 3; white-space: nowrap; background: rgba(13, 15, 19, .8); color: #e4e8ef; border-radius: 999px; padding: 7px 15px; font-size: 12px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .hintchip { display: flex; gap: 18px; align-items: center; }
  .debug { position: absolute; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--rl); background: var(--panel); color: var(--text); font-size: 10px; line-height: 14px; white-space: pre; font-variant-numeric: tabular-nums; }
  .debug b { font-weight: 400; color: var(--muted); margin-right: 4px; }
  .cnums { display: flex; gap: 12px; align-items: center; color: #9aa3b2; font-size: 12px; }
  .titlechip { position: absolute; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 999px; background: rgba(13, 15, 19, .8); color: #e4e8ef; font-weight: 500; }
  .titlechip .savestate { padding: 0; }
  .lcard { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 12px 0 8px; z-index: 2; flex-shrink: 0; }
  .lcard .grow { flex: 1; }
  .lc-name { font-weight: 600; padding: 0 6px; white-space: nowrap; }
  .lcard .savestate { padding: 0; }
  .lcard.pill { border-radius: 999px; padding: 0 16px 0 8px; gap: 4px; }
  .lcard.pill.nomenu { padding-left: 18px; }
  .lc-name.lg { font-size: 16px; letter-spacing: -.01em; }
  .lcard .dirty, .namechip .dirty { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex-shrink: 0; margin-left: 2px; }
  .lc-two { display: flex; flex-direction: column; padding: 0 6px; gap: 1px; }
  .lc-two .lc-name { padding: 0; line-height: 1.2; }
  .lc-state { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .lc-state .dirty { margin-left: 0; width: 6px; height: 6px; }
  .lcard.twoline { height: 50px; }
  .lc-top { display: flex; gap: 10px; align-items: center; align-self: flex-start; flex-shrink: 0; }
  .lcbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; flex-shrink: 0; }
  .lcact { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 7px; border-radius: 999px; flex-shrink: 0; }
  .lcact .ib { border-radius: 999px; }
  .lc-gap { width: 14px; flex-shrink: 0; }
  .lcard.namebox { padding: 0 7px; gap: 0; }
  .lcard.namebox .dirty { margin: 0 10px 0 9px; }
  .lc-field { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; background: var(--field); color: var(--text); font-weight: 400; min-width: 132px; white-space: nowrap; }
  .lc-field svg.i { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
  .lc-field.edit { min-width: 168px; padding-right: 10px; }
  .lc-field.edit .grow { flex: 1; }
  .lc-field.edit .i:last-child { color: var(--faint); }
  .lc-cap { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .lc-val { font-weight: 400; white-space: nowrap; }
  .lcard.namebox .lc-two { padding: 0 6px 0 11px; gap: 2px; }
  .lcard.namebox.tab { padding-left: 16px; }
  .lcard.namebox.tab > svg.i { width: 15px; height: 15px; color: var(--muted); margin-right: 8px; }
  .lcard.namebox.plain { padding-left: 18px; }
  .lcard.namebox.withmenu { padding: 0 6px 0 8px; }
  .lcard.namebox.withmenu .lc-val { padding-left: 4px; }
  .lc-val.m { font-weight: 500; }
  .lc-val.doc { font-size: 14px; }
  .lcard.namebox .chev { width: 14px; height: 14px; color: var(--muted); margin-right: 8px; }
  .lcard.namebox.chevron .dirty { margin-right: 6px; }
  .lc-edited { color: var(--muted); margin: 0 12px 0 6px; white-space: nowrap; }
  .lcard.namebox.sub .lc-two { padding-left: 11px; padding-right: 12px; }
  .lcard.namebox.sub .lc-cap { font-size: 12px; }
  .float .blk.lcbtn, .float .blk.lcact, .float .blk.actisl, .float .blk.namechip { border-radius: 999px; }
  .act { height: 30px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .act svg.i { width: 13px; height: 13px; }
  .act.play svg.i { fill: currentColor; stroke: none; width: 12px; height: 12px; }
  .act.save { background: var(--save); color: #fff; }
  .act.play { background: var(--accent); color: #fff; }
  .tint .act.save { background: rgba(47, 168, 102, .2); color: var(--save-ink); }
  .tint .act.play { background: var(--soft); color: var(--ink); }
  .actisl { height: 44px; padding: 0 8px; border-radius: 999px; display: flex; align-items: center; flex-shrink: 0; }
  .actisl .act { background: transparent; }
  .actisl.edit { padding: 0 8px; gap: 2px; }
  .lc-top { position: relative; }
  .lc-top.abs { position: absolute; z-index: 3; }
  .actisl.icon { width: 44px; padding: 0; justify-content: center; }
  .act.icon { width: 30px; padding: 0; justify-content: center; }
  .act.icon svg.i { width: 16px; height: 16px; }
  .act.play.icon svg.i { width: 14px; height: 14px; }
  .lc-top .menu.down { top: 54px; }
  .lc-top .menu.up { bottom: 54px; }
  .actisl .lc-gap { width: 10px; }
  .grp { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 2px; border-radius: 999px; background: var(--field); }
  .grp .ib { border-radius: 999px; width: 28px; height: 28px; }
  .actisl.tint .act + .act { margin-left: 6px; }
  .burger { z-index: 5; justify-content: center; padding: 0; }
  .burger > .ib { width: 34px; height: 34px; border-radius: calc(var(--rl) - 7px); color: var(--muted); }
  .burger > .ib.on { background: var(--soft); color: var(--ink); }
  .burger .menu.main { top: 0; left: calc(100% + 6px); min-width: 170px; color: var(--text); }
  .burger .menu.sub { top: 69px; left: calc(100% + 4px); min-width: 250px; }
  .ed .menu { background: rgb(24, 27, 33); }
  .toolcol { z-index: 3; flex-direction: column; height: auto; padding: 7px 0; gap: 4px; }
  /* The Shape tool's kinds menu: centred on the Shape tool (the second button, whose middle is 7 + 34 + 4 + 17 = 62 px
     down the island), the arrow on the menu's middle, reaching 1 px into the menu so no seam shows at any scale. */
  .toolcol .menu.kinds { top: 62px; transform: translateY(-50%); left: calc(100% + 12px); min-width: 170px; }
  .toolcol .menu.kinds::before { content: ""; position: absolute; left: -6px; top: calc(50% - 7px); border: 7px solid transparent; border-left: 0; border-right-color: rgb(24, 27, 33); }
  .menu .mi svg.i { color: var(--muted); }
  .menu .mi.on { background: var(--soft); color: var(--ink); }
  .menu .mi.on svg.i { color: var(--ink); }
  .isl.toolcol .tool { width: 34px; height: 34px; border-radius: calc(var(--rl) - 7px); }
  .actisl.edit .ib { border-radius: 999px; width: 30px; height: 30px; }
  .actisl .act.save { color: var(--save-ink); }
  .actisl .act.play { color: var(--ink); }
  .namechip { position: absolute; transform: translateX(-50%); z-index: 3; height: 44px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .namechip.static { position: static; transform: none; display: inline-flex; }
  .leftcol { position: absolute; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
  .leftcol > .insp { flex: 1; min-height: 0; }
  .leftcol > .opts { position: static; align-self: flex-start; }
  .minimap { position: absolute; z-index: 2; padding: 3px; }
  .minimap svg { display: block; border-radius: calc(var(--rl) - 3px); }
  .dock { position: absolute; transform: translateX(-50%); height: 46px; z-index: 3; }
  .onebar .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .barnums { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; margin-right: 14px; }
  .isl .tool { width: 30px; height: 30px; }

  /* Panels */
  .panel { display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
  .ph { height: 40px; display: flex; align-items: center; padding: 0 var(--inset); flex-shrink: 0; }
  .ph.title { font-weight: 600; font-size: 14px; }
  .ph.caps { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .ihead { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); flex-shrink: 0; margin-bottom: 4px; }
  .ihead .nm { flex: 1; height: 28px; display: flex; align-items: center; padding: 0 8px; border-radius: var(--r); background: var(--field); font-weight: 500; }
  .ihead .nm.ghost { background: transparent; }
  .ihead .nm.pill { border-radius: 999px; padding: 0 12px; }
  .ihead .eye { color: var(--muted); }

  /* Cards */
  .card { padding-bottom: 6px; }
  .card.line { border-bottom: 1px solid var(--line); }
  .card.space { padding-bottom: 12px; }
  .card.tile { background: var(--raised); border-radius: var(--r2); margin: 0 8px 8px; padding: 2px 0 6px; }
  .card.tile .f, .card.tile .chead { padding-left: 10px; padding-right: 10px; }
  .card.inset { background: rgba(0, 0, 0, .2); border-radius: var(--r2); margin: 0 8px 8px; padding: 2px 0 6px; }
  .card.inset .f, .card.inset .chead { padding-left: 10px; padding-right: 10px; }
  .card.island { background: var(--panel); border-radius: var(--rl); margin-top: 8px; padding: 4px 0 8px; -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .kbox .card.island { margin: 8px 12px 0; background: var(--app); }
  .insp.bare { overflow: visible; }
  .insp.bare .ihead { margin-bottom: 0; }
  .chead { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); font-weight: 600; }
  .chead .t { flex: 1; }
  .chead svg.i { width: 14px; height: 14px; color: var(--faint); }
  .card.space .chead .t { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

  /* Fields */
  .f { height: var(--rowh); display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); }
  .f > label { width: 116px; color: var(--muted); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f .vals { flex: 1; display: flex; gap: 6px; min-width: 0; align-items: center; }
  .inp { flex: 1; min-width: 0; height: calc(var(--rowh) - 5px); padding: 0 8px; display: flex; align-items: center; gap: 5px; font-family: var(--font-num); white-space: nowrap; overflow: hidden; border-radius: var(--r); }
  .inp.filled { background: var(--field); }
  .inp.ghost { background: transparent; }
  .inp.ghost.hov { background: var(--field); }
  .inp.pill { background: var(--field); border-radius: 999px; padding: 0 11px; }
  .inp.ro { background: transparent; }
  .inp.focus { background: var(--soft); }
  .inp.err { background: rgba(229, 83, 75, .16); color: #ff9a93; }
  .inp.fillbar { background: linear-gradient(90deg, var(--soft) 0 var(--p), var(--field) var(--p)); }
  .inp .ax { color: var(--muted); }
  .inp .unit { color: var(--faint); margin-left: auto; }
  .inp .chev { margin-left: auto; width: 12px; height: 12px; color: var(--muted); }
  .inp.short { flex: 0 0 60px; }
  .msg { padding: 0 var(--inset) 4px calc(var(--inset) + 124px); font-size: 12px; color: #ff9a93; }
  .slider { flex: 1; height: 3px; background: var(--hover); border-radius: 2px; position: relative; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); border-radius: 2px; }
  .slider b { position: absolute; top: -4px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--text); }
  .cb { width: 15px; height: 15px; border-radius: 4px; background: var(--field); display: inline-flex; align-items: center; justify-content: center; }
  .cb.on { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .cb.on svg.i { width: 11px; height: 11px; stroke-width: 2.6; }
  .tg { width: 28px; height: 16px; border-radius: 999px; background: rgba(255, 255, 255, .12); position: relative; flex-shrink: 0; }
  .tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
  .tg.on { background: var(--accent); }
  .tg.on::after { left: 14px; background: var(--on); }
  .swc { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
  .inp.pill .swc { border-radius: 50%; }

  /* Entities panel rows */
  .rows { padding: 2px 0; }
  .lrow { height: var(--rowh); display: flex; align-items: center; gap: 6px; padding-right: 10px; color: var(--text); }
  .lrow .kind { color: var(--muted); display: flex; }
  .lrow .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .eye { color: var(--faint); display: flex; }
  .lrow .fold { width: 14px; height: 14px; color: var(--muted); }
  .rows.pill .lrow, .rows.solid .lrow, .rows.grey .lrow { margin: 0 6px; border-radius: var(--r); }
  .lrow.hover { background: var(--hover); }
  .lrow.hover .eye { color: var(--muted); }
  .rows.pill .lrow.sel { background: var(--soft); }
  .rows.pill .sel .kind { color: var(--ink); }
  .rows.grey .lrow.sel { background: rgba(255, 255, 255, .1); }
  .rows.solid .lrow.sel { background: var(--accent); color: var(--on); }
  .rows.solid .sel .kind, .rows.solid .sel .eye { color: var(--on); }

  /* The status bar */
  .status { display: flex; align-items: center; gap: 20px; padding: 0 12px; color: var(--muted); font-size: 12px; z-index: 3; }
  .status .hint { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .warn { display: flex; align-items: center; gap: 4px; }
  .status svg.i { width: 13px; height: 13px; }

  /* What floats: the options strip, menus, dialogs, the Play bar */
  .opts { position: absolute; z-index: 4; display: flex; gap: 2px; padding: 4px; background: var(--menu); border-radius: var(--r2); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .opts .ib { padding: 0 9px; }
  .menu { position: absolute; z-index: 6; min-width: 214px; background: var(--menu); border-radius: var(--r2); padding: 6px; -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .menu.static { position: relative; display: inline-block; vertical-align: top; }
  .mi { height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: var(--r); gap: 12px; }
  .mi .l { flex: 1; }
  .mi .k { color: var(--muted); font-family: var(--font-num); font-size: 12px; }
  .mi.dis, .mi.dis .k { color: var(--faint); }
  .mi .chev { width: 12px; height: 12px; }
  .menu.solid .mi.hover { background: var(--accent); color: var(--on); }
  .menu.solid .mi.hover .k { color: var(--on); opacity: .8; }
  .menu.soft .mi.hover { background: var(--soft); }
  .msep { height: 7px; }
  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); z-index: 7; }
  .dialog { position: absolute; z-index: 8; left: 50%; top: 290px; width: 400px; margin-left: -200px; background: var(--menu); border-radius: calc(var(--r2) + 4px); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .dialog.static { position: relative; left: auto; top: auto; margin: 0 16px; width: auto; }
  .dialog h3 { margin: 0; padding: 22px 22px 6px; font-size: 14px; font-weight: 600; }
  .dialog p { margin: 0; padding: 0 22px 20px; color: var(--muted); line-height: 1.55; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
  .btn { height: 30px; padding: 0 16px; border-radius: var(--r); display: inline-flex; align-items: center; background: var(--raised); color: var(--text); }
  .btn.primary { background: var(--grad); color: var(--on); font-weight: 600; border: 0; }
  .btn.dis { color: var(--faint); }

// has: rectangles, circles and polygons with a fill, an outline (`line`, `lw` in level px) and an opacity (`op`).
// Most shapes have no outline: the low-poly look comes from a darker and a lighter facet of each shape instead.
const R = (id, x, y, w, h, fill, more = {}) => Object.assign({ id, t: 'rect', x, y, w, h, fill }, more);
const O = (id, cx, cy, r, fill, more = {}) => Object.assign({ id, t: 'circle', cx, cy, r, fill }, more);
const P = (id, p, fill, more = {}) => Object.assign({ id, t: 'poly', p, fill }, more);

// A mountain range: valley, peak, valley, peak … valley. The moon is to the right, so each peak's right slope is lit.
function range(id, base, pts, dark, lit) {
  const out = [P(id, [[pts[0][0], base], ...pts, [pts[pts.length - 1][0], base]], dark)];
  for (let i = 1; i < pts.length - 1; i += 2) {
    const [px, py] = pts[i], [nx, ny] = pts[i + 1], fx = px - (px - pts[i - 1][0]) * 0.25;

function pine(id, x, h) {

  });

// A rock with a lit top facet.

  // The ball.
  O('ball', 140, 180, 40, '#f2c14e'), O('ball-hi', 126, 166, 13, '#ffffff', { op: 0.4 }),
  // The car, its headlight's beam first so it sits behind the shapes it falls on.
  P('beam', [[-118, 270], [40, 238], [40, 314]], '#ffe39a', { op: 0.1 }),
  P('carbody', [[-452, 314], [-446, 272], [-400, 258], [-338, 252], [-310, 200], [-222, 198], [-182, 250], [-130, 262], [-112, 290], [-118, 314]], '#e0524a'),
  P('carshade', [[-452, 314], [-450, 294], [-114, 294], [-118, 314]], '#a8383a'),

  O('lamp', -124, 272, 9, '#ffe39a'),
  O('wheel1', -370, 338, 42, '#1d1a24', { line: '#4a4458', lw: 10 }), O('hub1', -370, 338, 13, '#8b93a1'),
  O('wheel2', -190, 338, 42, '#1d1a24', { line: '#4a4458', lw: 10 }), O('hub2', -190, 338, 13, '#8b93a1'),

const HINGES = [[-370, 338], [-190, 338]];

function drawShape(s, X, Y, z, opts) {
  let style = `fill="${s.fill}"${s.op == null ? '' : ` fill-opacity="${s.op}"`}`;
  if (s.line && !opts.noLines) style += ` stroke="${s.line}" stroke-width="${Math.max(0.6, s.lw * z)}" stroke-linejoin="round"`;
  const m = (opts.play && PLAYED[s.id]) || {};
  const dx = m.dx || 0, dy = m.dy || 0;
  if (s.t === 'rect') {
    const x = X(s.x + dx), y = Y(s.y + dy);
    return `<rect x="${x}" y="${y}" width="${s.w * z}" height="${s.h * z}" ${style} transform="rotate(${m.rot || 0} ${x + s.w * z / 2} ${y + s.h * z / 2})"/>`;
  }
  if (s.t === 'circle') return `<circle cx="${X(s.cx + dx)}" cy="${Y(s.cy + dy)}" r="${s.r * z}" ${style}/>`;
  return `<polygon points="${s.p.map(([a, b]) => X(a + dx) + ',' + Y(b + dy)).join(' ')}" ${style}/>`;
}
function handle(x, y) {
  if (S.handle === 'square') return `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" rx="1.5" style="fill:#fff;stroke:var(--accent)" stroke-width="1.5"/>`;
  if (S.handle === 'round') return `<circle cx="${x}" cy="${y}" r="4.5" style="fill:#fff;stroke:var(--accent)" stroke-width="1.5"/>`;
  return `<circle cx="${x}" cy="${y}" r="4.5" style="fill:var(--accent);stroke:#fff" stroke-width="1.5"/>`;
}
const handles = (x, y, w, h) => [[0, 0], [.5, 0], [1, 0], [0, .5], [1, .5], [0, 1], [.5, 1], [1, 1]].map(([a, b]) => handle(x + a * w, y + b * h)).join('');

// A frame's label over its top left corner: the name in bold, then a gap and the size.
function frameLabel(x, y, name, size) {
  return `<text x="${x}" y="${y - 7}" font-size="12" fill="rgba(236,240,246,.6)" style="font-family:var(--font-ui)"><tspan font-weight="600" fill="rgba(236,240,246,.92)">${name}</tspan><tspan dx="10">${size}</tspan></text>`;
}
// One SVG of the level view. Overlays are drawn in screen pixels.
function scene(w, h, z, cx, cy, opts) {
  const X = (x) => +(cx + x * z).toFixed(2), Y = (y) => +(cy + y * z).toFixed(2);
  const [bx, by, bw, bh] = MAP_AREA, inside = `x="${X(bx)}" y="${Y(by)}" width="${bw * z}" height="${bh * z}"`;
  // The editor's colour everywhere, then the World's fill inside the level bounds only.
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${OUTSIDE}"/><rect ${inside} fill="${WORLD_FILL}"/>`;
  for (const shape of LEVEL) s += drawShape(shape, X, Y, z, opts);
  // The grid, over the entities and inside the bounds only, in white since the World's fill is dark.
  if (opts.grid) {
    const step = 50 * z, ox = ((cx % step) + step) % step, oy = ((cy % step) + step) % step;
    s += `<defs><pattern id="g" width="${step}" height="${step}" patternUnits="userSpaceOnUse" x="${ox}" y="${oy}"><path d="M ${step} 0 L 0 0 0 ${step}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern></defs><rect ${inside} fill="url(#g)"/>`;
    s += `<path d="M ${cx} ${Math.max(0, Y(by))} V ${Math.min(h, Y(by + bh))} M ${Math.max(0, X(bx))} ${cy} H ${Math.min(w, X(bx + bw))}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
  }
  if (opts.joints) for (const [a, b] of HINGES) s += `<circle cx="${X(a)}" cy="${Y(b)}" r="7" fill="#fff" stroke="#1d2430" stroke-width="1.5"/><circle cx="${X(a)}" cy="${Y(b)}" r="2" fill="#1d2430"/>`;
  if (opts.bounds) {
    const x = X(bx), y = Y(by);
    s += `<rect ${inside} fill="none" stroke="rgba(236,240,246,.35)" stroke-width="1"/>`;
    s += frameLabel(x, y, 'World', `${bw} × ${bh}`);
  }
  if (opts.cameraFrame) {
    s += `<rect x="${X(-960)}" y="${Y(-540)}" width="${1920 * z}" height="${1080 * z}" fill="none" stroke="rgba(236,240,246,.55)" stroke-width="1.5"/>`;
    s += frameLabel(X(-960), Y(-540), 'Camera', '1920 × 1080');
  }
  if (opts.selected) {
    const r = LEVEL.find((e) => e.id === opts.selected), x = X(r.x), y = Y(r.y), rw = r.w * z, rh = r.h * z;
    s += `<rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="none" style="stroke:var(--accent)" stroke-width="1.5"/>` + handles(x, y, rw, rh);
  }
  if (opts.drawing) {
    const pts = [[-760, -250], [-560, -390], [-330, -300], [-380, -90]], mouse = [-640, -40];
    s += `<polygon points="${pts.concat([mouse]).map(([a, b]) => X(a) + ',' + Y(b)).join(' ')}" fill="#4a90d9" fill-opacity=".35"/>`;
    s += `<polyline points="${pts.map(([a, b]) => X(a) + ',' + Y(b)).join(' ')}" fill="none" stroke="rgba(236,240,246,.85)" stroke-width="1.5"/>`;
    s += `<polyline points="${X(pts[3][0])},${Y(pts[3][1])} ${X(mouse[0])},${Y(mouse[1])} ${X(pts[0][0])},${Y(pts[0][1])}" fill="none" stroke="rgba(236,240,246,.85)" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    pts.forEach(([a, b], i) => { s += i === 0 ? `<circle cx="${X(a)}" cy="${Y(b)}" r="6" style="fill:#fff;stroke:var(--accent)" stroke-width="2"/>` : handle(X(a), Y(b)); });
    const mx = X(mouse[0]), my = Y(mouse[1]);
    s += `<path d="M ${mx - 9} ${my} H ${mx + 9} M ${mx} ${my - 9} V ${my + 9}" stroke="#ffffff" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
}

  menu: () => `<div class="inl"><div class="menu static ${S.menu} shade">${menuBody([['Cut', 'Ctrl+X'], ['Copy', 'Ctrl+C', 'hover'], ['Paste', 'Ctrl+V'], '-', ['Redo', 'Ctrl+Shift+Z', 'dis']])}</div></div>`,
  note: () => `<div class="note ${S.note}">${ic('warning', 'style="color:var(--warning);margin-top:1px"')}<span>Needs a Surface to collide. <span class="fix">Add Surface</span></span></div>` +
    `<div class="note ${S.note} tipn">${ic('info', 'style="color:var(--tip);margin-top:1px"')}<span>A tip reads the same, with a blue icon.</span></div>`,
  handle: () => `<div class="inl"><svg width="200" height="90" viewBox="0 0 200 90" style="border-radius:6px"><rect width="200" height="90" fill="${WORLD_FILL}"/><rect x="60" y="25" width="80" height="40" fill="#4a90d9" stroke="#1f3552"/><rect x="60" y="25" width="80" height="40" fill="none" style="stroke:var(--accent)" stroke-width="1.5"/>${handles(60, 25, 80, 40)}</svg></div>`,
  play: () => playbar(false, 'static') + playbar(true, 'static')
};
function partsSheet() {
  return `<div class="sheet">` + KINDS.map(([key, title, desc, variants]) =>
    `<div class="kbox"><h4>${title}</h4>${desc ? `<div class="kd">${desc}</div>` : ''}` +
    variants.map(([v, label], i) => `<div class="var${S[key] === v ? ' cur' : ''}"><div class="vl"><b>${i + 1}</b> ${label}</div>${withS({ [key]: v }, PARTS[key])}</div>`).join('') +
    `</div>`).join('') + `</div>`;
}

// The page around the mockups
function buttons(id, items, current, onPick) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (const [v, label] of items) {
    const b = document.createElement('button');
    b.className = 'pick' + (v === current ? ' on' : '');
    b.textContent = label;
    b.onclick = () => onPick(v);
    el.appendChild(b);
  }
}
function render() {
  const d = DIRS.find((x) => x.id === state.dir) || DIRS[0];
  T = d.t;
  S = Object.assign({}, d.s);
  buttons('views', VIEWS, state.view, (v) => { state.view = v; render(); });
  const parts = state.view === 'parts';
  const cls = ['ed', 'float', parts ? 'tall' : ''].join(' ');
  document.getElementById('frame').innerHTML = `<div class="${cls}" style="${tokensCss(T)}">${MOMENTS[state.view]()}</div>`;
  document.getElementById('stage').classList.toggle('scroll', parts);
  try { localStorage.setItem('engine-v3-islands-17', JSON.stringify(state)); } catch (e) {}
  fit();
}
function fit() {
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  const parts = state.view === 'parts';
  const k = Math.min((stage.clientWidth - 24) / 1440, parts ? 1 : (stage.clientHeight - 16) / 900, 1);
  frame.style.transform = `scale(${k})`;
  document.getElementById('sizer').style.height = parts ? `${frame.offsetHeight * k + 24}px` : '0';
}
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  const i = DIRS.findIndex((x) => x.id === state.dir);
  if (e.key === 'ArrowRight') { state.dir = DIRS[Math.min(i + 1, DIRS.length - 1)].id; render(); }
  if (e.key === 'ArrowLeft') { state.dir = DIRS[Math.max(i - 1, 0)].id; render(); }
});
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
