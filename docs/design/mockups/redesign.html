<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page around the mockups */
  :root { --page: #0b0c0e; --page-2: #17181c; --page-3: #222329; --page-text: #d4d7dd; --page-muted: #80858f; --page-on: #eceef2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--page-text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .hdr { padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .hrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .hrow > .lbl { color: var(--page-muted); width: 72px; flex-shrink: 0; }
  .pick { font: inherit; color: var(--page-text); background: var(--page-2); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .pick:hover { background: var(--page-3); }
  .pick.on { background: var(--page-on); color: #111; }
  .ov { display: inline-flex; align-items: center; gap: 4px; color: var(--page-muted); font-size: 12px; margin-right: 6px; }
  .ov select { font: inherit; color: var(--page-text); background: var(--page-2); border: 0; border-radius: 6px; padding: 3px 4px; }
  .ov select.changed { background: #3b331d; color: #ffd98a; }
  .caption { color: var(--page-muted); max-width: 1180px; }
  .picks { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: #a9aeb8; user-select: all; }
  .stage { flex: 1; position: relative; overflow: hidden; }
  .stage.scroll { overflow-y: auto; }
  .frame { position: absolute; left: 50%; top: 8px; width: 1440px; margin-left: -720px; transform-origin: top center; border-radius: 10px; overflow: hidden; }

  /* The editor. Its tokens are set per direction on .ed. */
  .ed { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--app); color: var(--text); font-family: var(--font-ui); font-size: var(--fs);
    --warning: #e5b931; --tip: #5aa9f0; --danger: #e5534b; --playing: #3fb27f; --save: #2fa866; --save-ink: #6fd89d; --paused: #e5b931; --tooltip: #0b0d10; --tooltip-text: #e8ebf0; }
  .ed.tall { height: auto; }
  .ed svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .num { font-family: var(--font-num); }
  .abs { position: absolute; }
  .blk { background: var(--panel); }
  .bar { background: var(--bar); }
  .float .blk, .isl { border-radius: var(--rl); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .isl { background: var(--panel); display: flex; align-items: center; gap: 2px; padding: 0 7px; height: 44px; }
  .viewbox { overflow: hidden; }
  .viewbox svg { display: block; }


  /* The top bar */
  .top { display: flex; align-items: center; gap: 4px; padding: 0 8px; z-index: 3; }
  .float-top { background: none; padding: 0; display: flex; justify-content: space-between; }
  .isl .play { margin-right: 6px; }
  .grow { flex: 1; }
  .ib { height: 28px; min-width: 28px; padding: 0 6px; border-radius: var(--r); display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); }
  .ib.hover { background: var(--hover); }
  .ib.dim { color: var(--faint); }
  .ib.on { background: var(--soft); color: var(--ink); }
  .ib .chev { width: 12px; height: 12px; color: var(--muted); }
  .levelname { padding: 0 8px; height: 28px; display: flex; align-items: center; font-weight: 500; }
  .savestate { color: var(--muted); display: flex; align-items: center; gap: 4px; padding-right: 6px; }
  .sep { width: 8px; }
  .play { height: 30px; padding: 0 16px; border-radius: var(--r); background: var(--grad); color: var(--on); display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .play svg.i { fill: currentColor; stroke: none; width: 12px; height: 12px; }
  .play.pill, .btn.pill { border-radius: 999px; }

  /* The toolbar strip */
  .tools { display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; z-index: 2; }
  .tools.h { flex-direction: row; padding: 6px; display: inline-flex; position: static; border-radius: var(--r2); }
  .tools.row { flex-direction: row; justify-content: center; padding: 0 7px; }
  .isl .tool { width: 30px; height: 30px; }
  .tool { width: 32px; height: 32px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; position: relative; color: var(--muted); }
  .tool.hover { background: var(--hover); color: var(--text); }
  .tool.on.fill { background: var(--accent); color: var(--on); }
  .tool.on.soft { background: var(--soft); color: var(--ink); }
  .tip-box { white-space: nowrap; background: var(--tooltip); color: var(--tooltip-text); border-radius: var(--r); padding: 5px 9px; font-size: 11px; display: inline-flex; gap: 10px; }
  .tip-box .k { color: #8a93a3; }

  .onebar .grow { flex: 1; }
  .cnums .warn, .barnums .warn { display: flex; align-items: center; gap: 4px; }
  .cnums svg.i, .barnums svg.i { width: 13px; height: 13px; }
  .hintchip { position: absolute; transform: translateX(-50%); z-index: 3; white-space: nowrap; background: rgba(13, 15, 19, .8); color: #e4e8ef; border-radius: 999px; padding: 7px 15px; font-size: 11.5px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .hintchip { display: flex; gap: 16px; align-items: center; }
  .cnums { display: flex; gap: 12px; align-items: center; color: #9aa3b2; font-size: 11px; }
  .titlechip { position: absolute; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-radius: 999px; background: rgba(13, 15, 19, .8); color: #e4e8ef; font-weight: 500; }
  .titlechip .savestate { padding: 0; }
  .lcard { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 12px 0 8px; z-index: 2; flex-shrink: 0; }
  .lcard .grow { flex: 1; }
  .lc-name { font-weight: 600; padding: 0 6px; white-space: nowrap; }
  .lcard .savestate { padding: 0; }
  .lcard.pill { border-radius: 999px; padding: 0 16px 0 8px; gap: 4px; }
  .lcard.pill.nomenu { padding-left: 18px; }
  .lc-name.lg { font-size: 16px; letter-spacing: -.01em; }
  .lcard .dirty, .namechip .dirty { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex-shrink: 0; margin-left: 2px; }
  .lc-two { display: flex; flex-direction: column; padding: 0 6px; gap: 1px; }
  .lc-two .lc-name { padding: 0; line-height: 1.2; }
  .lc-state { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
  .lc-state .dirty { margin-left: 0; width: 6px; height: 6px; }
  .lcard.twoline { height: 50px; }
  .lc-top { display: flex; gap: 10px; align-items: center; align-self: flex-start; flex-shrink: 0; }
  .lcbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; flex-shrink: 0; }
  .lcact { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 7px; border-radius: 999px; flex-shrink: 0; }
  .lcact .ib { border-radius: 999px; }
  .lc-gap { width: 14px; flex-shrink: 0; }
  .lcard.namebox { padding: 0 7px; gap: 0; }
  .lcard.namebox .dirty { margin: 0 10px 0 9px; }
  .lc-field { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; background: var(--field); color: var(--text); font-weight: 400; min-width: 132px; white-space: nowrap; }
  .lc-field svg.i { width: 14px; height: 14px; color: var(--muted); flex-shrink: 0; }
  .lc-field.edit { min-width: 168px; padding-right: 10px; }
  .lc-field.edit .grow { flex: 1; }
  .lc-field.edit .i:last-child { color: var(--faint); }
  .lc-cap { font-size: 10.5px; color: var(--muted); line-height: 1.2; }
  .lc-val { font-weight: 400; white-space: nowrap; }
  .lcard.namebox .lc-two { padding: 0 6px 0 11px; gap: 2px; }
  .lcard.namebox.tab { padding-left: 16px; }
  .lcard.namebox.tab > svg.i { width: 15px; height: 15px; color: var(--muted); margin-right: 8px; }
  .lcard.namebox.plain { padding-left: 18px; }
  .lcard.namebox.withmenu { padding: 0 6px 0 8px; }
  .lcard.namebox.withmenu .lc-val { padding-left: 4px; }
  .lc-val.m { font-weight: 500; }
  .lc-val.doc { font-size: 15px; }
  .lcard.namebox .chev { width: 14px; height: 14px; color: var(--muted); margin-right: 8px; }
  .lcard.namebox.chevron .dirty { margin-right: 6px; }
  .lc-edited { color: var(--muted); margin: 0 12px 0 6px; white-space: nowrap; }
  .lcard.namebox.sub .lc-two { padding-left: 11px; padding-right: 12px; }
  .lcard.namebox.sub .lc-cap { font-size: 11px; }
  .float .blk.lcbtn, .float .blk.lcact, .float .blk.actisl, .float .blk.namechip { border-radius: 999px; }
  .act { height: 30px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .act svg.i { width: 13px; height: 13px; }
  .act.play svg.i { fill: currentColor; stroke: none; width: 12px; height: 12px; }
  .act.save { background: var(--save); color: #fff; }
  .act.play { background: var(--accent); color: #fff; }
  .tint .act.save { background: rgba(47, 168, 102, .2); color: var(--save-ink); }
  .tint .act.play { background: var(--soft); color: var(--ink); }
  .actisl { height: 44px; padding: 0 8px; border-radius: 999px; display: flex; align-items: center; flex-shrink: 0; }
  .actisl .act { background: transparent; }
  .actisl .act.save { color: var(--save-ink); }
  .actisl .act.play { color: var(--ink); }
  .namechip { position: absolute; transform: translateX(-50%); z-index: 3; height: 44px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .namechip.static { position: static; transform: none; display: inline-flex; }
  .leftcol { position: absolute; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
  .leftcol > .insp { flex: 1; min-height: 0; }
  .leftcol > .opts { position: static; align-self: flex-start; }
  .zoomg { display: inline-flex; align-items: center; gap: 2px; background: var(--field); border-radius: 999px; padding: 0 2px; }
  .zoomg .ib { min-width: 26px; height: 26px; border-radius: 999px; }
  .zoomg .num { min-width: 36px; text-align: center; }
  .minimap { position: absolute; z-index: 2; padding: 3px; }
  .minimap svg { display: block; border-radius: 13px; }
  .mapfoot { display: flex; align-items: center; justify-content: center; height: 34px; }
  .mapfoot .zoomg, .zoomisl .zoomg { background: transparent; }
  .zoomisl { position: absolute; z-index: 3; display: flex; align-items: center; height: 36px; padding: 0 4px; }
  .zoomisl.v { flex-direction: column; width: 36px; height: auto; padding: 4px 0; }
  .zoomisl.v .zoomg { flex-direction: column; padding: 2px 0; }
  .zoomisl.v .zoomg .num { min-width: 0; padding: 6px 0; font-size: 11px; }
  .zoomover { position: absolute; right: 9px; bottom: 9px; background: rgba(13, 15, 19, .8); border-radius: 999px; }
  .zoomover .zoomg { background: transparent; }
  .zoomover .zoomg .ib { min-width: 24px; height: 24px; }
  .dock { position: absolute; transform: translateX(-50%); height: 46px; z-index: 3; }
  .onebar .hint { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .barnums { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 11px; margin-right: 14px; }
  .isl .tool { width: 30px; height: 30px; }

  /* Panels */
  .panel { display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
  .ph { height: 40px; display: flex; align-items: center; padding: 0 var(--inset); flex-shrink: 0; }
  .ph.title { font-weight: 600; font-size: calc(var(--fs) + .5px); }
  .ph.caps { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .ihead { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); flex-shrink: 0; margin-bottom: 4px; }
  .ihead .nm { flex: 1; height: 28px; display: flex; align-items: center; padding: 0 8px; border-radius: var(--r); background: var(--field); font-weight: 500; }
  .ihead .nm.ghost { background: transparent; }
  .ihead .nm.pill { border-radius: 999px; padding: 0 12px; }
  .ihead .eye { color: var(--muted); }

  /* Cards */
  .card { padding-bottom: 6px; }
  .card.line { border-bottom: 1px solid var(--line); }
  .card.space { padding-bottom: 12px; }
  .card.tile { background: var(--raised); border-radius: var(--r2); margin: 0 8px 8px; padding: 2px 0 6px; }
  .card.tile .f, .card.tile .chead { padding-left: 10px; padding-right: 10px; }
  .card.inset { background: rgba(0, 0, 0, .2); border-radius: var(--r2); margin: 0 8px 8px; padding: 2px 0 6px; }
  .card.inset .f, .card.inset .chead { padding-left: 10px; padding-right: 10px; }
  .card.island { background: var(--panel); border-radius: var(--rl); margin-top: 8px; padding: 4px 0 8px; -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .kbox .card.island { margin: 8px 12px 0; background: var(--app); }
  .insp.bare { overflow: visible; }
  .insp.bare .ihead { margin-bottom: 0; }
  .chead { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); font-weight: 600; }
  .chead .t { flex: 1; }
  .chead svg.i { width: 14px; height: 14px; color: var(--faint); }
  .card.space .chead .t { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

  /* Fields */
  .f { height: var(--rowh); display: flex; align-items: center; gap: 8px; padding: 0 var(--inset); }
  .f > label { width: 116px; color: var(--muted); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f .vals { flex: 1; display: flex; gap: 6px; min-width: 0; align-items: center; }
  .inp { flex: 1; min-width: 0; height: calc(var(--rowh) - 5px); padding: 0 8px; display: flex; align-items: center; gap: 5px; font-family: var(--font-num); white-space: nowrap; overflow: hidden; border-radius: var(--r); }
  .inp.filled { background: var(--field); }
  .inp.ghost { background: transparent; }
  .inp.ghost.hov { background: var(--field); }
  .inp.pill { background: var(--field); border-radius: 999px; padding: 0 11px; }
  .inp.ro { background: transparent; }
  .inp.focus { background: var(--soft); }
  .inp.err { background: rgba(229, 83, 75, .16); color: #ff9a93; }
  .inp.fillbar { background: linear-gradient(90deg, var(--soft) 0 var(--p), var(--field) var(--p)); }
  .inp .ax { color: var(--muted); }
  .inp .unit { color: var(--faint); margin-left: auto; }
  .inp .chev { margin-left: auto; width: 12px; height: 12px; color: var(--muted); }
  .inp.short { flex: 0 0 60px; }
  .msg { padding: 0 var(--inset) 4px calc(var(--inset) + 124px); font-size: 11px; color: #ff9a93; }
  .slider { flex: 1; height: 3px; background: var(--hover); border-radius: 2px; position: relative; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--muted); border-radius: 2px; }
  .slider b { position: absolute; top: -4px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--text); }
  .cb { width: 15px; height: 15px; border-radius: 4px; background: var(--field); display: inline-flex; align-items: center; justify-content: center; }
  .cb.on { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .cb.on svg.i { width: 11px; height: 11px; stroke-width: 2.6; }
  .tg { width: 28px; height: 16px; border-radius: 999px; background: rgba(255, 255, 255, .12); position: relative; flex-shrink: 0; }
  .tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
  .tg.on { background: var(--accent); }
  .tg.on::after { left: 14px; background: var(--on); }
  .swc { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
  .inp.pill .swc { border-radius: 50%; }

  /* Entities panel rows */
  .rows { padding: 2px 0; }
  .lrow { height: var(--rowh); display: flex; align-items: center; gap: 6px; padding-right: 10px; color: var(--text); }
  .lrow .kind { color: var(--muted); display: flex; }
  .lrow .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .eye { color: var(--faint); display: flex; }
  .lrow .fold { width: 14px; height: 14px; color: var(--muted); }
  .rows.pill .lrow, .rows.solid .lrow, .rows.grey .lrow { margin: 0 6px; border-radius: var(--r); }
  .lrow.hover { background: var(--hover); }
  .lrow.hover .eye { color: var(--muted); }
  .rows.pill .lrow.sel { background: var(--soft); }
  .rows.pill .sel .kind { color: var(--ink); }
  .rows.grey .lrow.sel { background: rgba(255, 255, 255, .1); }
  .rows.solid .lrow.sel { background: var(--accent); color: var(--on); }
  .rows.solid .sel .kind, .rows.solid .sel .eye { color: var(--on); }

  /* The status bar */
  .status { display: flex; align-items: center; gap: 20px; padding: 0 12px; color: var(--muted); font-size: 11px; z-index: 3; }
  .status .hint { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .warn { display: flex; align-items: center; gap: 4px; }
  .status svg.i { width: 13px; height: 13px; }

  /* What floats: the options strip, menus, dialogs, the Play bar */
  .opts { position: absolute; z-index: 4; display: flex; gap: 2px; padding: 4px; background: var(--menu); border-radius: var(--r2); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .opts .ib { padding: 0 9px; }
  .menu { position: absolute; z-index: 6; min-width: 214px; background: var(--menu); border-radius: var(--r2); padding: 6px; -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .menu.static { position: relative; display: inline-block; vertical-align: top; }
  .mi { height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: var(--r); gap: 12px; }
  .mi .l { flex: 1; }
  .mi .k { color: var(--muted); font-family: var(--font-num); font-size: 11px; }
  .mi.dis, .mi.dis .k { color: var(--faint); }
  .mi .chev { width: 12px; height: 12px; }
  .menu.solid .mi.hover { background: var(--accent); color: var(--on); }
  .menu.solid .mi.hover .k { color: var(--on); opacity: .8; }
  .menu.soft .mi.hover { background: var(--soft); }
  .msep { height: 7px; }
  .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); z-index: 7; }
  .dialog { position: absolute; z-index: 8; left: 50%; top: 290px; width: 400px; margin-left: -200px; background: var(--menu); border-radius: calc(var(--r2) + 4px); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .dialog.static { position: relative; left: auto; top: auto; margin: 0 16px; width: auto; }
  .dialog h3 { margin: 0; padding: 22px 22px 6px; font-size: calc(var(--fs) + 2px); font-weight: 600; }
  .dialog p { margin: 0; padding: 0 22px 20px; color: var(--muted); line-height: 1.55; }
  .dialog .row { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 16px; }
  .btn { height: 30px; padding: 0 16px; border-radius: var(--r); display: inline-flex; align-items: center; background: var(--raised); color: var(--text); }
  .btn.primary { background: var(--grad); color: var(--on); font-weight: 600; border: 0; }
  .btn.dis { color: var(--faint); }
  .addc { margin: 8px var(--inset) 12px; height: 30px; border-radius: var(--r); display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--raised); color: var(--muted); }
  .addc.pill { border-radius: 999px; }
  .game { position: absolute; inset: 0; background: #000; }
  .playbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--menu); border-radius: var(--r2); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .playbar.static { position: static; transform: none; display: inline-flex; margin: 0 16px 8px; }
  .playbar.dot, .playbar.tint { border-radius: 999px; padding: 4px 6px; }
  .playbar.tint { background: color-mix(in srgb, var(--pc) 16%, var(--menu)); }
  .playbar .state { display: flex; align-items: center; gap: 7px; padding: 0 10px 0 8px; font-weight: 600; color: var(--pc); letter-spacing: .05em; font-size: 11px; }
  .playbar .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
  .playbar.dot .state i, .playbar.tint .state i { }
  .playbar .ib { padding: 0 10px; }
  .playbar.dot .ib, .playbar.tint .ib { border-radius: 999px; }
  .playbar .k { color: var(--muted); font-size: 11px; }

  tools: (o) => TOOLS.map((t) => toolHtml(t, o.tool)).join(''),
  play: () => `<span class="play ${S.btn}">${ic('play')}Play</span>`,
  view: () => `<span class="ib">View${CHEV}</span><span class="ib num">40%${CHEV}</span><span class="ib">${ic('help')}</span>`
};
const nums = (o) => `<span class="num">${o.pos}</span><span>${o.sel}</span><span class="warn">${ic('warning', 'style="color:var(--warning)"')}<span class="num">1</span></span>`;
const entities = (o) => `<div class="abs blk panel ents" style="${pos(geo().ents)}"><div class="ph ${S.head}">Entities</div>${rowsHtml(ROWS, o.sel, o.hover)}</div>`;

// Inspector fields
const fc = () => `inp ${S.field}`;
const F = {
  num: (l, v, u = '', o = {}) => {
    let vals;
    if (o.slider !== undefined && S.slider === 'fill') vals = `<div class="${fc()} fillbar" style="--p:${o.slider * 100}%">${v}<span class="unit">${u}</span></div>`;
    else if (o.slider !== undefined) vals = `<div class="${fc()} short">${v}<span class="unit">${u}</span></div><div class="slider"><i style="width:${o.slider * 100}%"></i><b style="left:${o.slider * 100}%"></b></div>`;
    else vals = `<div class="${o.ro ? 'inp ro' : fc()}${o.focus ? ' focus' : ''}${o.err ? ' err' : ''}${o.hov ? ' hov' : ''}">${v}<span class="unit">${u}</span></div>`;
    return `<div class="f"><label>${l}</label><div class="vals">${vals}</div></div>`;
  },
  vec: (l, a, b, u = '') => `<div class="f"><label>${l}</label><div class="vals"><div class="${fc()}"><span class="ax">X</span>${a}<span class="unit">${u}</span></div><div class="${fc()}"><span class="ax">Y</span>${b}<span class="unit">${u}</span></div></div></div>`,
  choice: (l, v) => `<div class="f"><label>${l}</label><div class="vals"><div class="${fc()}">${v}${CHEV}</div></div></div>`,
  colour: (l, hex) => `<div class="f"><label>${l}</label><div class="vals"><div class="${fc()}"><span class="swc" style="background:${hex}"></span>${hex.toUpperCase()}</div></div></div>`,
  check: (l, on) => `<div class="f"><label>${l}</label><div class="vals">${S.check === 'switch' ? `<span class="tg${on ? ' on' : ''}"></span>` : `<span class="cb${on ? ' on' : ''}">${on ? ic('check') : ''}</span>`}</div></div>`
};
const card = (title, body) => `<div class="card ${S.card}"><div class="chead">${ic('down')}<span class="t">${title}</span>${ic('dots')}</div>${body}</div>`;

function inspector(o) {
  const g = geo(), bare = S.card === 'island', head = '';
  if (o.noInspector) return '';
  return `<div class="panel insp${bare ? ' bare' : ' blk'}">${bare ? '<div class="blk" style="border-radius:var(--rl)">' : ''}${head}<div class="ph ${S.head}">Inspector</div>
    <div class="ihead"><span style="color:var(--muted);display:flex">${ic('rect')}</span><div class="nm ${S.field === 'filled' ? '' : S.field}">Rectangle 1</div><span class="ib eye">${ic('eye')}</span></div>${bare ? '</div>' : ''}
    <div style="overflow:${bare ? 'visible' : 'hidden'}">
    ${card('TransformComponent', F.vec('Position', '20', '340', 'px') + F.num('Rotation', '0', '°') + F.vec('Scale', '1', '1') + F.num('Skew', '0', '°'))}
    ${card('ShapeComponent', F.choice('Kind', 'Rectangle') + F.num('Width', '160', 'px') + F.num('Height', '80', 'px', { focus: true }))}
    ${card('StyleComponent', F.colour('Fill', '#4a90d9') + F.colour('Outline colour', '#1f3552') + F.num('Outline width', '2', 'px') + F.num('Opacity', '100', '%', { slider: 1 }))}
    ${card('BodyComponent', F.choice('Type', 'Dynamic') + F.num('Gravity scale', '1', '', { slider: .55 }) + F.num('Linear damping', '0', '', { slider: 0 }) + F.check('Fixed rotation', false) + F.check('Bullet', false) + F.check('Merge', true) + F.num('Mass', '5.12', 'kg', { ro: true }))}
    ${card('SurfaceComponent', F.num('Density', '1', '', { slider: .01 }) + F.num('Friction', '0.3', '', { slider: .06 }) + F.num('Restitution', '0', '', { slider: 0 }) + F.check('Sensor', false))}
    </div></div>`;
}

// The top left: the main menu, the level's name and Save and Play, as the Mix row places them.
const DIRTY = '<span class="dirty" title="Not saved"></span>';
function nameHtml() {
  return `<span class="lc-val">Car test</span>${DIRTY}`;
}
function nameChip(cls = '', style = '') {
  return `<div class="blk namechip ${cls}" style="${style}"><span>Car test</span>${DIRTY}</div>`;
}
function levelCard(o) {
  const centred = S.name === 'centre', menu = C.menu(o);
  const where = S.burger === 'own' ? 'own' : S.burger === 'actions' || centred ? 'actions' : 'name';
  const buttons = `<span class="act save">${ic('save')}Save</span><span class="act play">${ic('play')}Play</span>`;
  const inPill = S.actions === 'inpill' && !centred;
  let out = where === 'own' ? `<div class="blk lcbtn">${menu}</div>` : '';
  if (!centred) {
    const cls = ['blk', 'lcard', 'pill', 'namebox', where === 'name' ? 'withmenu' : 'plain'].join(' ');
    out += `<div class="${cls}">${where === 'name' ? menu : ''}${nameHtml()}${inPill ? `<span class="lc-gap"></span>${buttons}` : ''}</div>`;
  }
  if (!inPill) {
    const lead = where === 'actions' ? menu : '';
    if (S.actions === 'apart') out += (lead ? `<div class="blk lcbtn">${lead}</div>` : '') + `<div class="blk actisl"><span class="act save">${ic('save')}Save</span></div><div class="blk actisl"><span class="act play">${ic('play')}Play</span></div>`;
    else out += `<div class="blk lcact ${S.actions === 'tint' ? 'tint' : ''}">${lead}${buttons}</div>`;
  }
  return `<div class="lc-top">${out}</div>`;
}
const toolHtml = (icon, active, hover) => `<span class="tool${icon === active ? ' on ' + S.tool : ''}${icon === hover ? ' hover' : ''}">${ic(icon)}</span>`;
const TOOLS = ['select', 'shape', 'joint'];
function bottom(o) {
  const g = geo();
  const chip = `<span>${o.hint}</span><span class="cnums">${nums(o)}</span>`;
  return `<div class="abs isl dock" style="left:${g.cx}px;top:${H - M - 46}px">${C.tools(o)}<span class="sep"></span>${C.edit()}</div>` +
    `<div class="hintchip" style="left:${g.cx}px;top:${H - M - 46 - GP - 30}px">${chip}</div>`;
}
function view(opts) {
  const g = geo();
  return `<div class="abs viewbox" style="${pos([0, 0, W, H])}">${scene(W, H, VIEW_Z, (g.rx0 + g.rx1) / 2, VIEW_CY, Object.assign({ grid: true, cameraFrame: true, joints: true }, opts))}</div>`;
}
// The minimap and the zoom, with their right and bottom edges at r and b: where each island sits.
const MAP_W = 180, ZOOM_H = 36;
function mapParts(r, b) {
  const inner = MAP_W - 6, mapH = Math.round(inner * MAP_AREA[3] / MAP_AREA[2]) + 6, foot = S.zoom === 'footer' ? 34 : 0;
  const map = [r - MAP_W, b - mapH - foot, MAP_W, mapH + foot];
  const zoom = S.zoom === 'above' ? [r - MAP_W / 2, map[1] - GP - ZOOM_H] : S.zoom === 'side' ? [map[0] - GP - 36, b - 104] : null;
  return { map, zoom, inner, height: b - (S.zoom === 'above' ? zoom[1] : map[1]) };
}
function minimap(r = W - M, b = H - M) {
  const g = mapParts(r, b), [ax, ay, aw] = MAP_AREA, w = g.inner, h = Math.round(w * MAP_AREA[3] / aw), z = w / aw;
  const [vx, vy, vw, vh] = visibleArea(), X = (x) => (x - ax) * z, Y = (y) => (y - ay) * z;
  const frame = `<rect x="${X(vx)}" y="${Y(vy)}" width="${vw * z}" height="${vh * z}" rx="3" fill="rgba(79,140,255,.1)" style="stroke:var(--accent)" stroke-width="1.5"/>`;
  const map = scene(w, h, z, -ax * z, -ay * z, { grid: false, noLines: true }).replace('</svg>', frame + '</svg>');
  const zoom = `<span class="zoomg"><span class="ib">${ic('minus')}</span><span class="num">40%</span><span class="ib">${ic('plus')}</span></span>`;
  const zoomUp = `<span class="zoomg"><span class="ib">${ic('plus')}</span><span class="num">40%</span><span class="ib">${ic('minus')}</span></span>`;
  const inside = S.zoom === 'footer' ? `<div class="mapfoot">${zoom}</div>` : S.zoom === 'over' ? `<div class="zoomover">${zoom}</div>` : '';
  let out = `<div class="blk minimap" style="${pos(g.map)}">${map}${inside}</div>`;
  if (S.zoom === 'above') out += `<div class="blk zoomisl" style="left:${g.zoom[0]}px;top:${g.zoom[1]}px;transform:translateX(-50%)">${zoom}</div>`;
  if (S.zoom === 'side') out += `<div class="blk zoomisl v" style="left:${g.zoom[0]}px;top:${g.zoom[1]}px">${zoomUp}</div>`;
  return out;
}
function editor(o) {
  o = Object.assign({ tool: 'select', hint: 'Select · drag a handle to resize, Shift keeps proportions', pos: 'x 20, y 340', sel: 'Nothing selected' }, o, o.top);
  return view(o.scene || {}) + `<div class="leftcol" style="${pos(geo().left)}">${levelCard(o)}${o.noInspector ? shapeStrip() : inspector(o)}</div>` + (S.name === 'centre' ? nameChip('', `left:${geo().cx}px;top:${M}px`) : '') + entities(o) + minimap() + bottom(o) + (o.extra || '');
}

function shapeStrip() {
  const kinds = [['rect', 'Rectangle'], ['circle', 'Circle'], ['polygon', 'Polygon']];
  return `<div class="opts">${kinds.map(([icon, name]) => `<span class="ib${icon === 'polygon' ? ' on' : ''}">${ic(icon)}${name}</span>`).join('')}</div>`;
}
function menuBody(items) {
  return items.map((m) => m === '-' ? '<div class="msep"></div>' :
    `<div class="mi${m[2] ? ' ' + m[2] : ''}"><span class="l">${m[0]}</span>${m[1] === '>' ? ic('right', 'class="i chev"') : `<span class="k">${m[1] || ''}</span>`}</div>`).join('');
}
function mainMenu() {
  const x = M, y = M + 50;
  const top = [['File', '>'], ['Edit', '>', 'hover'], ['Arrange', '>'], ['View', '>'], ['Help', '>']];
  const edit = [['Undo Move 1 entity', 'Ctrl+Z'], ['Redo', 'Ctrl+Shift+Z', 'dis'], '-', ['Cut', 'Ctrl+X'], ['Copy', 'Ctrl+C'], ['Paste', 'Ctrl+V', 'hover'], ['Duplicate', 'Ctrl+D'], ['Delete', 'Del'], '-', ['Select all', 'Ctrl+A'], ['Rename', 'F2'], ['Hide or show', 'Ctrl+Shift+H']];
  return `<div class="menu ${S.menu}" style="left:${x}px;top:${y}px">${menuBody(top)}</div><div class="menu ${S.menu}" style="left:${x + 206}px;top:${y + 38}px;min-width:250px">${menuBody(edit)}</div>`;
}
const dialogBody = () => `<h3>Replace the open level?</h3><p>Export it first if you want to keep it.</p><div class="row"><span class="btn ${S.btn}">Cancel</span><span class="btn primary ${S.btn}">Replace</span></div>`;
function playbar(paused, extraCls = '') {
  const pc = paused ? 'var(--paused)' : 'var(--playing)';
  return `<div class="playbar ${S.play} ${extraCls}" style="--pc:${pc}"><span class="state"><i></i>${paused ? 'PAUSED' : 'PLAYING'}</span>` +
    (paused ? `<span class="ib">${ic('play')}Resume</span><span class="ib">${ic('step')}Step <span class="k">F9</span></span>` : `<span class="ib">${ic('pause')}Pause <span class="k">F8</span></span><span class="ib dim">${ic('step')}Step <span class="k">F9</span></span>`) +
    `<span class="ib">${ic('stop')}Stop <span class="k">Ctrl+Enter</span></span></div>`;
}

const MOMENTS = {
  shape: () => editor({ sel: 'Rectangle 1', hover: 'Crate 2', scene: { selected: 'rect1' } }),
  draw: () => editor({ tool: 'shape', noInspector: true, scene: { drawing: true }, hint: 'Shape · click to add a point, click the first point to close, Enter to finish as a line', pos: 'x −640, y −40' }),
  menu: () => editor({ sel: 'Rectangle 1', scene: { selected: 'rect1' }, top: { menuOpen: true }, extra: mainMenu() }),
  dialog: () => editor({ extra: `<div class="scrim"></div><div class="dialog">${dialogBody()}</div>`, hint: 'Select · click to select, drag to move', pos: 'x 412, y −96' }),
  play: () => `<div class="game"><div style="position:absolute;left:0;top:45px">${scene(1440, 810, 0.75, 720, 405, { play: true })}</div></div>${playbar(false)}`,
  parts: () => partsSheet()
};

// The parts sheet: each kind with all its variants, drawn in the chosen direction's colours.
function schematic() {
  return `<div class="schem"><div class="ed float" style="${tokensCss(T)}position:absolute;left:0;top:0;transform:scale(.2);transform-origin:0 0">${editor({ sel: 'Rectangle 1', scene: { selected: 'rect1' } })}</div></div>`;
}
const PARTS = {
  layout: schematic,
  head: () => `<div class="ph ${S.head}">Inspector</div>`,
  card: () => card('TransformComponent', F.vec('Position', '20', '340', 'px') + F.num('Rotation', '0', '°')) + card('ShapeComponent', F.choice('Kind', 'Rectangle') + F.num('Width', '160', 'px')),
  field: () => F.num('Width', '160', 'px', { hov: true }) + F.num('Height', '80.25', 'px', { focus: true }) + F.num('Friction', 'abc', '', { err: true }) + `<div class="msg">Can't read this as a number</div>` + F.colour('Fill', '#4a90d9'),
  slider: () => F.num('Gravity scale', '1', '', { slider: .55 }) + F.num('Opacity', '100', '%', { slider: 1 }),
  check: () => F.check('Merge', true) + F.check('Bullet', false),
  row: () => rowsHtml([[1, 'rect', 'Crate 1'], [1, 'rect', 'Crate 2'], [1, 'rect', 'Rectangle 1'], [1, 'circle', 'Ball']], 'Rectangle 1', 'Crate 2'),
  tool: () => `<div class="inl"><span class="blk tools h">${TOOLS.map((t) => toolHtml(t, 'shape', 'joint')).join('')}</span><span class="tip-box">Joint<span class="k">6</span></span></div>`,
  btn: () => `<div class="inl"><span class="btn ${S.btn}">Cancel</span><span class="btn primary ${S.btn}">Replace</span><span class="play ${S.btn}">${ic('play')}Play</span></div>`,
  menu: () => `<div class="inl"><div class="menu static ${S.menu}">${menuBody([['Cut', 'Ctrl+X'], ['Copy', 'Ctrl+C', 'hover'], ['Paste', 'Ctrl+V'], '-', ['Redo', 'Ctrl+Shift+Z', 'dis']])}</div></div>`,
  note: () => `<div class="note ${S.note}">${ic('warning', 'style="color:var(--warning);margin-top:1px"')}<span>Needs a SurfaceComponent to collide. <span class="fix">Add SurfaceComponent</span></span></div>` +
    `<div class="note ${S.note} tipn">${ic('info', 'style="color:var(--tip);margin-top:1px"')}<span>A tip reads the same, with a blue icon.</span></div>`,
  handle: () => `<div class="inl"><svg width="200" height="90" viewBox="0 0 200 90" style="border-radius:6px"><rect width="200" height="90" fill="${BG}"/><rect x="60" y="25" width="80" height="40" fill="#4a90d9" stroke="#1f3552"/><rect x="60" y="25" width="80" height="40" fill="none" style="stroke:var(--accent)" stroke-width="1.5"/>${handles(60, 25, 80, 40)}</svg></div>`,
  play: () => playbar(false, 'static') + playbar(true, 'static')
};
function topLeftPart() {
  return `<div class="inl"><div style="background:${BG};border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;width:100%">${levelCard({})}${S.name === 'centre' ? nameChip('static') : ''}</div></div>`;
}
function partsSheet() {
  return `<div class="sheet">` + KINDS.map(([key, title, desc, variants]) =>
    `<div class="kbox"><h4>${title}</h4>${desc ? `<div class="kd">${desc}</div>` : ''}` +
    variants.map(([v, label], i) => `<div class="var${S[key] === v ? ' cur' : ''}"><div class="vl"><b>${i + 1}</b> ${label}</div>${withS({ [key]: v }, PARTS[key])}</div>`).join('') +
    `</div>`).join('') + `</div>`;
}

// The page around the mockups
function picksText(d) {
  const changed = Object.entries(state.over).filter(([k, v]) => v && v !== d.s[k]);
  const font = FONTS.find((f) => f[0] === state.font);
  let s = `Variation ${d.id} ${d.name}`;
  for (const [k, v] of changed) {
    const kind = KINDS.find((x) => x[0] === k), i = kind[3].findIndex((x) => x[0] === v);
    s += `, ${kind[1].toLowerCase()} ${i + 1} ${kind[3][i][1]}`;
  }
  return s + `, font ${font[1]}`;
}
function buttons(id, items, current, onPick) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (const [v, label] of items) {
    const b = document.createElement('button');
    b.className = 'pick' + (v === current ? ' on' : '');
    b.textContent = label;
    b.onclick = () => onPick(v);
    el.appendChild(b);
  }
}
function render() {
  const d = DIRS.find((x) => x.id === state.dir) || DIRS[0];
  T = d.t;
  S = Object.assign({}, d.s);
  for (const [k, v] of Object.entries(state.over)) if (v) S[k] = v;
  buttons('dirs', DIRS.map((x) => [x.id, `${x.id} ${x.name}`]), d.id, (v) => { state.dir = v; state.over = {}; render(); });
  buttons('views', VIEWS, state.view, (v) => { state.view = v; render(); });
  buttons('fonts', FONTS.map((f) => [f[0], f[1]]), state.font, (v) => { state.font = v; render(); });
  const overs = document.getElementById('overs');
  overs.innerHTML = KINDS.map(([key, title, , variants]) => `<label class="ov">${title}<select data-k="${key}" class="${state.over[key] && state.over[key] !== d.s[key] ? 'changed' : ''}">` +
    variants.map(([v, label], i) => `<option value="${v}"${S[key] === v ? ' selected' : ''}>${i + 1} ${label}${d.s[key] === v ? ' ·' : ''}</option>`).join('') + `</select></label>`).join('') +
    `<button class="pick" id="reset">Reset to the variation</button>`;
  for (const sel of overs.querySelectorAll('select')) sel.onchange = () => { state.over[sel.dataset.k] = sel.value; render(); };
  document.getElementById('reset').onclick = () => { state.over = {}; render(); };
  document.getElementById('caption').textContent = `${d.desc} "·" in a list marks the variation's own pick.`;
  document.getElementById('picks').textContent = picksText(d);
  const parts = state.view === 'parts';
  const cls = ['ed', 'float', parts ? 'tall' : ''].join(' ');
  document.getElementById('frame').innerHTML = `<div class="${cls}" style="${tokensCss(T)}">${MOMENTS[state.view]()}</div>`;
  document.getElementById('stage').classList.toggle('scroll', parts);
  try { localStorage.setItem('engine-v3-islands-11', JSON.stringify(state)); } catch (e) {}
  fit();
}
function fit() {
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  const parts = state.view === 'parts';
  const k = Math.min((stage.clientWidth - 24) / 1440, parts ? 1 : (stage.clientHeight - 16) / 900, 1);
  frame.style.transform = `scale(${k})`;
  document.getElementById('sizer').style.height = parts ? `${frame.offsetHeight * k + 24}px` : '0';
}
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  const i = DIRS.findIndex((x) => x.id === state.dir);
  if (e.key === 'ArrowRight') { state.dir = DIRS[Math.min(i + 1, DIRS.length - 1)].id; state.over = {}; render(); }
  if (e.key === 'ArrowLeft') { state.dir = DIRS[Math.max(i - 1, 0)].id; state.over = {}; render(); }
});
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
