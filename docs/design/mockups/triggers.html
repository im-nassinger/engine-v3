<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger Card Options</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* The editor's tokens (tokens.md), plus one amber for the event. */
  :root {
    --app: #0d0f13; --panel: rgb(24, 27, 33); --raised: rgba(255,255,255,.04); --field: rgba(255,255,255,.055); --hover: rgba(255,255,255,.065);
    --text: #e4e8ef; --muted: #8b93a1; --faint: #586070; --accent: #4f8cff; --soft: rgba(79,140,255,.2); --ink: #8fb5ff;
    --event: #e0a24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--app); color: var(--text); font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  svg.lucide { width: 14px; height: 14px; stroke-width: 1.8; flex: none; }

  /* The page: a row of option buttons, one panel, one line under it. */
  nav { display: flex; justify-content: center; gap: 6px; padding: 32px 16px 0; flex-wrap: wrap; }
  nav button { font: inherit; color: var(--muted); background: none; border: 0; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--soft); color: var(--ink); }
  .caption { text-align: center; color: var(--muted); margin: 14px 16px 28px; }
  .stage { display: flex; justify-content: center; padding: 0 16px 60px; }

  /* The Entity inspector's Triggers card. */
  .insp { width: 300px; background: var(--panel); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 6px; }
  .card-head { height: 32px; display: flex; align-items: center; padding: 0 10px; background: var(--raised); border-radius: 8px;
    font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  .body { padding: 10px 4px 4px; display: flex; flex-direction: column; gap: 14px; }
  .add { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  .add:hover { background: var(--hover); color: var(--text); }

  .head { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 8px; }
  .head .name { flex: 1; font-weight: 600; }
  .sw { width: 24px; height: 14px; border-radius: 99px; background: var(--accent); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; left: 12px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .more { color: var(--muted); display: grid; place-items: center; width: 22px; height: 22px; }
  b { font-weight: 400; color: var(--ink); }

  /* 1 · Now: today's card */
  .now .blk { background: var(--raised); border-radius: 10px; padding: 2px 8px 8px; }
  .now .t { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; margin: 8px 0 2px; display: flex; }
  .now .t span { margin-left: auto; color: var(--faint); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .now b { border-bottom: 1px dotted var(--ink); }
  .now .a { color: var(--muted); }

  /* 2 · Steps: one short line per part */
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { display: grid; grid-template-columns: 38px 1fr; align-items: center; min-height: 30px; padding: 0 8px; border-radius: 8px; cursor: pointer; }
  .row:hover, .row.open { background: var(--hover); }
  .row .k { color: var(--faint); }
  .row.when .k { color: var(--event); }
  .gap { height: 6px; }
  .form { grid-column: 2; padding: 4px 0 8px; display: flex; flex-direction: column; gap: 4px; }
  .pill { height: 24px; border-radius: 6px; background: var(--field); display: flex; align-items: center; padding: 0 8px; color: var(--text); }
  .pill span { margin-left: auto; color: var(--muted); font-size: 9px; }

  /* 3 · Folded: one line per trigger */
  .fold { border-radius: 10px; }
  .fold.open { background: var(--raised); padding-bottom: 6px; }
  .fold .line { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; }
  .fold:not(.open) .line:hover { background: var(--hover); }
  .fold .line .ev { color: var(--event); }
  .fold .line .txt { flex: 1; min-width: 0; }
  .fold .line .sum { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 4 · Sentence: one calm paragraph, values as soft pills */
  .para { padding: 2px 8px; line-height: 30px; color: var(--muted); }
  .para b { color: var(--text); background: var(--field); border-radius: 6px; padding: 3px 7px; cursor: pointer; }
  .para b:hover { background: var(--soft); color: var(--ink); }

  /* 5 · When / Then: two boxes */
  .box { background: var(--raised); border-radius: 10px; padding: 10px; }
  .box .lab { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .box.ev .lab { color: var(--event); }
  .box .item { display: flex; align-items: center; gap: 10px; height: 28px; }
  .box .item svg { color: var(--muted); }
  .box.ev .item svg { color: var(--event); }
  .box .cond { color: var(--muted); margin-top: 4px; }
  .arrow { display: flex; justify-content: center; color: var(--faint); margin: -8px 0; }
</style>
</head>
<body>

<nav id="nav"></nav>
<div class="caption" id="caption"></div>
<div class="stage"><div class="insp">
  <div class="card-head">Triggers</div>
  <div class="body" id="body"></div>
</div></div>

<script>
// Two example triggers, written once in the shape most options use.
const ic = (name) => `<i data-lucide="${name}"></i>`;
const TRIGGERS = [
  {
    name: 'Coin pickup', icon: 'hand', sum: 'add 1 to coins, destroy this',
    when: 'Something <b>starts</b> touching <b>this</b>',
    ifs: ['<b>other</b> has tag <b>player</b>'],
    dos: [
      { icon: 'plus', text: 'Add <b>1</b> to <b>coins</b>', form: [['add', true], ['1', false], ['coins', true]] },
      { icon: 'trash-2', text: 'Destroy <b>this</b>' },
    ],
    sentence: 'When something <b>starts</b> touching <b>this</b>, if <b>other</b> has tag <b>player</b>: add <b>1</b> to <b>coins</b>, then destroy <b>this</b>.',
  },
  {
    name: 'Timed door', icon: 'radio', sum: 'move up, wait 2 s, move back',
    when: 'Gets the event <b>open</b>',
    ifs: [],
    dos: [
      { icon: 'move', text: 'Set <b>Position</b> to <b>0, -200</b>' },
      { icon: 'hourglass', text: 'Wait <b>2 s</b>' },
      { icon: 'move', text: 'Set <b>Position</b> to <b>0, 0</b>' },
    ],
    sentence: 'When this gets the event <b>open</b>: set <b>Position</b> to <b>0, -200</b>, wait <b>2 s</b>, then set <b>Position</b> to <b>0, 0</b>.',
  },
];

const head = (tr) => `<div class="head"><span class="name">${tr.name}</span><span class="sw"></span><span class="more">${ic('ellipsis')}</span></div>`;
const addTrigger = `<div class="add">${ic('plus')} Add trigger</div>`;
let openRow = '0:0';
let openFold = 0;

function steps(tr, ti) {
  const row = (cls, k, html, key, form) => {
    const isOpen = key && openRow === key;
    const fields = isOpen && form ? `<div class="form">${form.map(([x, menu]) => `<div class="pill">${x}${menu ? '<span>▾</span>' : ''}</div>`).join('')}</div>` : '';
    return `<div class="row ${cls} ${isOpen ? 'open' : ''}" ${key ? `data-row="${key}"` : ''}><span class="k">${k}</span><span>${html}</span>${fields}</div>`;
  };
  return `<div class="rows">
    ${row('when', 'when', tr.when)}
    ${tr.ifs.map((x, i) => row('', i ? '' : 'if', x)).join('')}
    <div class="gap"></div>
    ${tr.dos.map((d, i) => row('', i ? '' : 'do', d.text, `${ti}:${i}`, d.form)).join('')}
    <div class="add">${ic('plus')} Add</div>
  </div>`;
}

const OPTIONS = [
  {
    label: 'Now',
    caption: "Today's card, for comparison.",
    draw: () => TRIGGERS.map((tr) => `<div class="now"><div class="blk">${head(tr)}
      <div class="t">When <span>one event</span></div>${tr.sentence.split(':')[0].replace(/, if .*/, '')}
      <div class="t">If <span>all must be true</span></div>${tr.ifs.join('<br>')}<div class="a">+ Add check</div>
      <div class="t">Do <span>top to bottom</span></div>${tr.dos.map((d) => d.text).join('<br>')}<div class="a">+ Add action</div>
      <div class="t">Repeat</div><b>every time</b></div></div>`).join('') + addTrigger,
  },
  {
    label: 'Steps',
    caption: 'One short line per part. Click an action to edit it.',
    draw: () => TRIGGERS.map((tr, i) => `<div>${head(tr)}${steps(tr, i)}</div>`).join('') + addTrigger,
  },
  {
    label: 'Folded',
    caption: 'One line per trigger. Click to open it.',
    draw: () => TRIGGERS.map((tr, i) => {
      const isOpen = openFold === i;
      return `<div class="fold ${isOpen ? 'open' : ''}"><div class="line" data-fold="${i}"><span class="ev">${ic(tr.icon)}</span>
        <div class="txt"><div>${tr.name}</div>${isOpen ? '' : `<div class="sum">${tr.sum}</div>`}</div>
        <span class="sw"></span>${ic(isOpen ? 'chevron-down' : 'chevron-right')}</div>
        ${isOpen ? steps(tr, i) : ''}</div>`;
    }).join('') + addTrigger,
  },
  {
    label: 'Sentence',
    caption: 'Reads as one sentence. Click a highlighted word to change it.',
    draw: () => TRIGGERS.map((tr) => `<div>${head(tr)}<div class="para">${tr.sentence}</div></div>`).join('') + addTrigger,
  },
  {
    label: 'When / Then',
    caption: 'The event in one box, what happens in another.',
    draw: () => `<div>${head(TRIGGERS[0])}</div>` + [TRIGGERS[0]].map((tr) => `
      <div class="box ev"><div class="lab">When</div><div class="item">${ic(tr.icon)}<span>${tr.when}</span></div>
        ${tr.ifs.map((x) => `<div class="cond">only if ${x}</div>`).join('')}</div>
      <div class="arrow">${ic('arrow-down')}</div>
      <div class="box"><div class="lab">Then</div>${tr.dos.map((d) => `<div class="item">${ic(d.icon)}<span>${d.text}</span></div>`).join('')}</div>`).join('') + addTrigger,
  },
];

let current = 1;
function render() {
  document.getElementById('nav').innerHTML = OPTIONS.map((o, i) =>
    `<button class="${i === current ? 'on' : ''}" data-opt="${i}">${i + 1} · ${o.label}</button>`).join('');
  document.getElementById('caption').textContent = OPTIONS[current].caption;
  document.getElementById('body').innerHTML = OPTIONS[current].draw();
  lucide.createIcons();
}

document.addEventListener('click', (ev) => {
  const opt = ev.target.closest('[data-opt]');
  const row = ev.target.closest('[data-row]');
  const fold = ev.target.closest('[data-fold]');
  if (opt) current = +opt.dataset.opt;
  else if (row && !ev.target.closest('.form')) openRow = openRow === row.dataset.row ? null : row.dataset.row;
  else if (fold) openFold = openFold === +fold.dataset.fold ? null : +fold.dataset.fold;
  else return;
  render();
});
document.addEventListener('keydown', (ev) => {
  const n = Number(ev.key);
  if (n >= 1 && n <= OPTIONS.length) { current = n - 1; render(); }
});
render();
</script>
</body>
</html>
