<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger Card Options</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* The editor's tokens (tokens.md), plus mockup-only colours for an event and for the kinds of word. */
  :root {
    --app: #0d0f13; --panel: rgb(24, 27, 33); --raised: rgba(255,255,255,.04); --field: rgba(255,255,255,.055); --hover: rgba(255,255,255,.065);
    --text: #e4e8ef; --muted: #8b93a1; --faint: #586070; --accent: #4f8cff; --soft: rgba(79,140,255,.2); --ink: #8fb5ff;
    --event: #e0a24a; --check: #4fb8ad; --wait: #a58bf2;
    --ent-bg: rgba(79,140,255,.16); --ent: #9cbdff;
    --val-bg: rgba(165,139,242,.16); --val: #c9b8ff;
    --num-bg: rgba(63,178,127,.16); --num: #84dcb3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--app); color: var(--text); font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  svg.lucide { width: 14px; height: 14px; stroke-width: 1.8; flex: none; }

  /* The page: option buttons, a caption, one card. */
  nav { display: flex; justify-content: center; gap: 4px; padding: 32px 16px 0; flex-wrap: wrap; max-width: 860px; margin: 0 auto; }
  nav button { font: inherit; color: var(--muted); background: none; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--soft); color: var(--ink); }
  .caption { text-align: center; color: var(--muted); margin: 16px 16px 6px; }
  .keys { text-align: center; color: var(--faint); font-size: 10px; margin-bottom: 28px; }
  .stage { display: flex; justify-content: center; padding: 0 16px 80px; }

  /* The Triggers card in a 344 px Entity inspector (the game starts it at 300 px; 344 fits Scratch's longest line). Spacing: 8 outside, 12 inside a trigger, 8 between rows. */
  .insp { width: 344px; background: var(--panel); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 8px; }
  .card-head { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--raised); border-radius: 10px;
    font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  .card-head svg { color: var(--muted); }
  .body { padding: 12px 0 0; display: flex; flex-direction: column; gap: 12px; }
  .add-trigger { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 10px; color: var(--muted); cursor: pointer; border: 1px dashed rgba(255,255,255,.1); }
  .add-trigger:hover { background: var(--hover); color: var(--text); border-color: transparent; }

  .trig { background: var(--raised); border-radius: 12px; padding: 12px; }
  .head { display: flex; align-items: center; gap: 10px; height: 24px; margin-bottom: 12px; }
  .head .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .ev { color: var(--event); }
  .sw { width: 26px; height: 15px; border-radius: 99px; background: var(--accent); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; left: 13px; top: 2.5px; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .icon-btn { color: var(--muted); display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; flex: none; cursor: pointer; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .smallcaps { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted); cursor: pointer; }
  .add:hover { background: var(--hover); color: var(--text); }
  .foot { display: flex; align-items: center; gap: 4px; margin-top: 8px; margin-left: -10px; }
  .foot .rep { margin-left: auto; color: var(--faint); display: inline-flex; gap: 6px; align-items: center; padding-right: 0; }

  /* Words of a sentence, three looks. */
  .w-dot { color: var(--ink); border-bottom: 1px dotted var(--ink); cursor: pointer; }
  .w-hi { color: var(--ink); cursor: pointer; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; white-space: nowrap; cursor: pointer; }
  .chip:hover { filter: brightness(1.2); }
  .chip.e { background: var(--ent-bg); color: var(--ent); }
  .chip.v { background: var(--val-bg); color: var(--val); }
  .chip.n { background: var(--num-bg); color: var(--num); }
  .chip.c { background: var(--field); color: var(--text); }
  .chip.c::after { content: "▾"; font-size: 9px; color: var(--muted); }
  .sent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; line-height: 22px; }
  .sent .t { color: var(--muted); }
  .chip.g { background: var(--field); color: var(--text); }

  /* A field: label then a pill, for the options that edit in a form. */
  .fields { display: flex; flex-direction: column; gap: 6px; }
  .frow { display: flex; align-items: center; gap: 10px; }
  .frow .lab { width: 56px; color: var(--muted); flex: none; }
  .pill { flex: 1; height: 26px; border-radius: 6px; background: var(--field); display: flex; align-items: center; padding: 0 10px; color: var(--text); }
  .pill span { margin-left: auto; color: var(--muted); font-size: 9px; }

  /* 1 · Now */
  .o-now .sec { margin-top: 10px; }
  .o-now .sec:first-of-type { margin-top: 0; }
  .o-now .sec .smallcaps { display: flex; margin-bottom: 4px; }
  .o-now .sec .smallcaps span { margin-left: auto; color: var(--faint); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .o-now .line { line-height: 22px; }
  .o-now .addline { color: var(--muted); line-height: 22px; }

  /* 2 · Chips and a lane */
  .o-lane .lane { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 10px 0; }
  .o-lane .lane:first-of-type { padding-top: 0; }
  .o-lane .lane + .lane { border-top: 1px solid rgba(255,255,255,.05); }
  .o-lane .lane .smallcaps { line-height: 22px; }
  .o-lane .lane.when .smallcaps { color: var(--event); }
  .o-lane .lane.if .smallcaps { color: var(--check); }
  .o-lane .lane.do .smallcaps { color: var(--ink); }
  .o-lane .stack { display: flex; flex-direction: column; gap: 8px; }
  .o-lane .num { color: var(--faint); width: 10px; }

  /* 3 · Icon rows */
  .o-icons .list { display: flex; flex-direction: column; gap: 4px; margin: 0 -6px; }
  .o-icons .row { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; padding: 6px; border-radius: 10px; cursor: pointer; }
  .o-icons .row:hover, .o-icons .row.open { background: var(--hover); }
  .o-icons .tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--soft); color: var(--ink); }
  .o-icons .tile.when { background: color-mix(in srgb, var(--event) 18%, transparent); color: var(--event); }
  .o-icons .tile.if { background: color-mix(in srgb, var(--check) 18%, transparent); color: var(--check); }
  .o-icons .tile.wait { background: color-mix(in srgb, var(--wait) 18%, transparent); color: var(--wait); }
  .o-icons .verb { font-weight: 600; line-height: 16px; }
  .o-icons .args { color: var(--muted); line-height: 18px; }
  .o-icons .args .w-hi { color: var(--ink); }
  .o-icons .row .fields { grid-column: 1 / 3; padding: 6px 4px 4px; }
  .o-icons .div { height: 1px; background: rgba(255,255,255,.05); margin: 4px 6px; }

  /* 4 · Blocks */
  .o-blocks .stack { display: flex; flex-direction: column; gap: 6px; }
  .o-blocks .b { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; }
  .o-blocks .b svg { margin-top: 4px; }
  .o-blocks .b.when { background: color-mix(in srgb, var(--event) 14%, var(--panel)); border-radius: 16px 16px 10px 10px; }
  .o-blocks .b.when svg { color: var(--event); }
  .o-blocks .b.if { background: color-mix(in srgb, var(--check) 12%, var(--panel)); margin-left: 14px; }
  .o-blocks .b.if svg { color: var(--check); }
  .o-blocks .b.do { background: color-mix(in srgb, var(--accent) 11%, var(--panel)); margin-left: 14px; }
  .o-blocks .b.do svg { color: var(--ink); }
  .o-blocks .b.wait { background: color-mix(in srgb, var(--wait) 13%, var(--panel)); margin-left: 14px; }
  .o-blocks .b.wait svg { color: var(--wait); }
  .o-blocks .b .sent .t { color: var(--text); }
  .o-blocks .foot { margin-left: 4px; }

  /* 5 · Flow line */
  .o-flow .flow { padding-left: 24px; }
  .o-flow .node { position: relative; padding: 4px 0 14px; }
  .o-flow .node::before { content: ""; position: absolute; left: -16px; top: 18px; bottom: -4px; width: 2px; background: rgba(255,255,255,.08); }
  .o-flow .node:last-child { padding-bottom: 4px; }
  .o-flow .node:last-child::before { display: none; }
  .o-flow .m { position: absolute; left: -22px; top: 7px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); }
  .o-flow .node.when .m { border-color: var(--event); background: var(--event); }
  .o-flow .node.if .m { border-color: var(--check); border-radius: 3px; transform: rotate(45deg) scale(.85); }
  .o-flow .node .smallcaps { display: block; margin-bottom: 4px; }
  .o-flow .node.when .smallcaps { color: var(--event); }
  .o-flow .node.if .smallcaps { color: var(--check); }
  .o-flow .later { position: relative; color: var(--wait); display: flex; align-items: center; gap: 6px; padding: 0 0 14px; }
  .o-flow .later::before { content: ""; position: absolute; left: -16px; top: -4px; bottom: -4px; border-left: 2px dashed var(--wait); }

  /* 6 · Steps */
  .o-steps .list { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
  .o-steps .row { display: grid; grid-template-columns: 40px 1fr; align-items: center; min-height: 32px; padding: 5px 8px; border-radius: 8px; }
  .o-steps .row:hover { background: var(--hover); }
  .o-steps .row .smallcaps { color: var(--faint); }
  .o-steps .row.when .smallcaps { color: var(--event); }
  .o-steps .space { height: 8px; }
  .o-steps .foot { margin-left: -10px; }

  /* 7 · Folded */
  .o-fold .fold { background: var(--raised); border-radius: 12px; }
  .o-fold .line { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; cursor: pointer; }
  .o-fold .fold:not(.open) .line:hover { background: var(--hover); }
  .o-fold .line .ev { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--event) 18%, transparent); color: var(--event); flex: none; }
  .o-fold .line .txt { flex: 1; min-width: 0; }
  .o-fold .line .nm { font-weight: 600; }
  .o-fold .line .sum { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-fold .line > svg { color: var(--muted); }
  .o-fold .inside { padding: 0 12px 12px; }
  .o-fold .inside .lane:first-of-type { padding-top: 4px; }

  /* 8 · Sentence */
  .o-sentence .para { line-height: 34px; color: var(--muted); }
  .o-sentence .para .chip { height: 24px; padding: 0 6px; }

  /* 9 · When / Then */
  .o-wt .box { border-radius: 10px; padding: 12px; background: rgba(255,255,255,.035); }
  .o-wt .box .smallcaps { margin-bottom: 8px; display: block; }
  .o-wt .box.when { background: color-mix(in srgb, var(--event) 9%, transparent); }
  .o-wt .box.when .smallcaps { color: var(--event); }
  .o-wt .item { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; line-height: 20px; }
  .o-wt .item svg { color: var(--muted); margin-top: 3px; }
  .o-wt .box.when .item svg { color: var(--event); }
  .o-wt .cond { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.06); color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
  .o-wt .cond svg { color: var(--check); margin-top: 3px; }
  .o-wt .arrow { display: flex; justify-content: center; color: var(--faint); height: 22px; align-items: center; }

  /* 10 · Tree */
  .o-tree .tree { display: flex; flex-direction: column; }
  .o-tree .tn { position: relative; padding: 5px 0 5px 26px; line-height: 22px; }
  .o-tree .tn::before { content: ""; position: absolute; left: 8px; top: 0; height: 17px; width: 12px; border-left: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.14); border-bottom-left-radius: 6px; }
  .o-tree .tn::after { content: ""; position: absolute; left: 8px; top: 17px; bottom: 0; border-left: 1px solid rgba(255,255,255,.14); }
  .o-tree .tn.last::after { display: none; }
  .o-tree .root { display: flex; gap: 10px; align-items: center; line-height: 22px; padding-bottom: 4px; }
  .o-tree .root svg { color: var(--event); }
  .o-tree .tn .kw { color: var(--check); margin-right: 6px; }
  .o-tree .tn .wait { color: var(--wait); }

  /* 11 · Branch: Tree's shape, one icon per line, thin lines, words coloured by what they are, one line each */
  .o-branch .t { color: var(--muted); }
  .o-branch .w { border-radius: 4px; padding: 0 2px; margin: 0 -2px; cursor: pointer; }
  .o-branch .w:hover { background: var(--hover); }
  .o-branch .w.e { color: var(--ent); } .o-branch .w.v { color: var(--val); }
  .o-branch .w.n { color: var(--num); } .o-branch .w.c { color: var(--text); }
  .o-branch .line { display: flex; align-items: center; gap: 8px; height: 26px; }
  .o-branch .line .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .o-branch .line svg { color: var(--muted); }
  .o-branch .root svg { color: var(--event); }
  .o-branch .kid.if svg, .o-branch .kid.if .kw { color: var(--check); }
  .o-branch .kid.wait > .line svg { color: var(--wait); }
  .o-branch .kids { margin-left: 6px; }
  .o-branch .kid { position: relative; padding: 2px 0 2px 18px; }
  .o-branch .kid::before { content: ""; position: absolute; left: 0; top: 0; height: 15px; width: 12px; border-left: 1px solid rgba(255,255,255,.12); border-bottom: 1px solid rgba(255,255,255,.12); border-bottom-left-radius: 6px; }
  .o-branch .kid::after { content: ""; position: absolute; left: 0; top: 15px; bottom: 0; border-left: 1px solid rgba(255,255,255,.12); }
  .o-branch .kid.last::after { display: none; }
  .o-branch .kid.wait > .kids > .kid::before, .o-branch .kid.wait > .kids > .kid::after { border-color: color-mix(in srgb, var(--wait) 45%, transparent); }
  .o-branch .foot { margin-top: 10px; }

  /* 12 · Scratch: snap-together blocks with a little roundness. --tx is where a block's tab sits. */
  /* Scratch's categories, in deeper colours the owner picked the tone of (2026-11-24: "#3d66c3, #2f897e,
     #b88133, etc."): amber for the event, blue for Motion (Position), violet for Variables. Each other kind
     has its own colour in that tone too (owner, 2026-11-24: different kinds had one colour): teal for the
     If, rose for Wait, red for Destroy, green for a trigger's Enabled (Claude). White words and icons, menus
     in the kind's colour darkened by a quarter, numbers as white ovals with Scratch's grey text. */
  .o-scratch { --sk-event: #b88133; --sk-ctl: #2f897e; --sk-act: #2f897e; --sk-wait: #ad4a7c;
    --sk-motion: #3d66c3; --sk-var: #7d58b8; --sk-destroy: #b5473d; --sk-enabled: #46812f;
    --sk-gap: color-mix(in srgb, #fff 4%, var(--panel)); } /* the trigger's background (--raised over --panel), opaque */
  /* Block colours in the editor's own way (tokens.md): a dark surface tinted with the kind's colour, as a
     warning note is tinted with --warning, with the editor's --text on it and the icon in the full colour.
     The colours are the mockup's event, check, accent and wait colours.
     A changeable part is a field like the editor's. Blocks touch with no gap; a 2 px border (.sk, below)
     traces each block's outline and notch in the trigger's background colour, so two blocks of one colour don't merge.
     Every block shows the same 36 px of colour with its words centred: 9 px above them, of which the
     block above covers 2 with its line, and 13 below, of which the next block covers 6. The event block
     has nothing above it, so it gets 7 px. */
  .sb.hat  { --ic: var(--event); }
  .o-scratch .sb { --dd: color-mix(in srgb, var(--bg) 75%, #000); color: #fff; }
  .o-scratch .sb.k-motion { --bg: var(--sk-motion); }
  .o-scratch .sb.k-var { --bg: var(--sk-var); }
  .o-scratch .sb.k-destroy { --bg: var(--sk-destroy); }
  .o-scratch .sb.k-enabled { --bg: var(--sk-enabled); }
  .o-scratch .sb > svg { color: #fff; }
  .o-scratch .sk-dd { background: var(--dd); color: #fff; }
  .o-scratch .sk-dd .path { color: rgba(255,255,255,.7); }
  .o-scratch .sk-num { background: #fff; color: #575e75; }
  .o-scratch .sb.slot { color: var(--muted); }
  .o-scratch .sb.slot > svg { color: inherit; }
  .sb.ctl  { --ic: var(--check); }
  .sb.do   { --ic: var(--accent); }
  .sb.wait { --ic: var(--wait); }
  .sb > svg { color: var(--ic); }
  /* The script scrolls sideways instead of wrapping: blocks grow to their words' width, and the stack is at
     least as wide as the card, so short blocks still fill it. */
  .o-scratch .script { overflow: auto; overflow-anchor: none; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
  .o-scratch .stack { display: flex; flex-direction: column; width: max-content; min-width: 100%; padding: 2px; box-sizing: border-box; } /* 2px: room for the blocks' border */
  .o-scratch .sb { flex-wrap: nowrap; white-space: nowrap; }
  /* A block is its body (::before, 6 px short of the bottom) and its tooth (::after, 20 px hanging into the
     block below), both slightly rounded. The 2 px gap around them is a ring of the trigger's background
     (box-shadow), which keeps the corners' roundness, so the tooth sits in a hole 2 px bigger on every side
     with corners rounded by 3 + 2 px. Layers, bottom to top: the tooth's ring (.tooth), the body and its
     ring, the tooth (::after, which covers the body's ring where they join). No notch is cut: the tooth
     above and its ring always cover where it would be. */
  .sb { --tx: 0px; --td: 6px; --r: 4px; --rtl: var(--r); --rtr: var(--r); --rbr: var(--r); --rbl: var(--r);
    position: relative; isolation: isolate; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 40px;
    padding: 9px 10px 13px; margin-bottom: -6px; color: var(--text); line-height: 22px; }
  .sb::before { content: ""; position: absolute; inset: 0 0 6px 0; z-index: -2; background: var(--bg);
    border-radius: var(--rtl) var(--rtr) var(--rbr) var(--rbl); box-shadow: 0 0 0 2px var(--sk-gap); }
  .sb::after, .sb > .tooth { content: ""; position: absolute; left: calc(var(--tx) + 14px); width: 20px; top: calc(100% - 7px); height: 7px;
    z-index: -1; background: var(--bg); border-radius: 0 0 3px 3px; }
  .sb > .tooth { z-index: -3; box-shadow: 0 0 0 2px var(--sk-gap); }
  .sb.end::after, .sb.end > .tooth { display: none; }
  .sk.open > .sb.end::after, .sk.open > .sb.end > .tooth { display: block; }
  .sb.hat { padding-top: 7px; }
  .sb.hat { --bg: var(--sk-event); }
  .sb.do { --bg: var(--sk-act); }
  .sb.wait { --bg: var(--sk-wait); }
  .sb.ctl { --bg: var(--sk-ctl); }
  .sb.ctl.top { --tx: 16px; }
  /* A block with nothing under it has no tab (.end), and so the If's bottom has no notch. The last block
     in an If gets 2 px more below its words, since the If's bottom draws its line over them. */
  .sb.ctl.bottom { min-height: 30px; padding: 0; }
  .sb.end { --td: 0px; }
  .sc-inner > .sk.last > .sb, .sc-inner > .sk.slot.show:last-child > .sb { padding-bottom: 15px; }
  .sc-inner > .sk.last.open > .sb { padding-bottom: 13px; }
  /* Adding a block (look only, nothing is added): hovering a block opens an empty slot under it, shaped
     like a block, with the hovered block's tab fitting its notch. A block with nothing under it shows its
     tab while its slot is open (.open). Only the spots a block can go: under the event when there's no If,
     at the top of the If, and under any action. */
  .sk.slot { display: none; cursor: pointer; }
  .sk.slot.show { display: flex; }
  .sk.open > .sb.end { --td: 6px; }
  .sb.slot { --bg: color-mix(in srgb, #fff 7%, var(--panel)); color: var(--muted); }
  .sk.slot:hover > .sb.slot { color: var(--text); --bg: color-mix(in srgb, #fff 10%, var(--panel)); }
  .sb svg { width: 16px; height: 16px; }
  .sc-mid { display: flex; }
  /* The border: each block's body and tooth carry a 2 px ring in the trigger's own background (owner,
     2026-11-24), so blocks read as cut apart by a gap. Blocks overlap by their
     whole 6 px tab, and a block draws above the ones under it (z-index set in scratch()), so its bottom line
     and tab are the seam. An If (.sc) draws its top, arm and bottom above the blocks it holds; the arm draws
     its own lines and covers the top's and bottom's lines where they meet it, so the If reads as one C. */
  .sc { position: relative; display: flex; flex-direction: column; }
  .sc > .sk { z-index: 1000; }
  /* Corners that meet the arm are square, so the C's lines run straight through its joints. */
  .o-scratch .sc .sb.ctl.top { --rbl: 0px; }
  .o-scratch .sc .sb.ctl.bottom { --rtl: 0px; }
  .o-scratch .sc .sc-inner .sb { --rtl: 0px; --rbl: 0px; }
  .sc-arm { position: relative; z-index: 1001; width: 16px; flex: none; background: var(--sk-ctl);
    --line: var(--sk-gap); box-shadow: -2px 0 0 var(--line), inset -2px 0 0 var(--line); }
  .sk { display: flex; flex-direction: column; position: relative; }
  .sc-inner { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .sk-dd { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,.09); cursor: pointer; white-space: nowrap; }
  .sk-dd::after { content: "▾"; font-size: 9px; opacity: .7; }
  .sk-num { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 99px; background: rgba(255,255,255,.09); color: var(--text); cursor: pointer; white-space: nowrap; }
  .fx { color: var(--ent); }
  .path { color: var(--muted); }
  .o-scratch .fx { color: inherit; }
  .o-scratch .sk-dd, .o-scratch .sk-num { border-radius: 4px; }
</style>
</head>
<body>

<nav id="nav"></nav>
<div class="caption" id="caption"></div>
<div class="keys">← → or 1–9, 0 to switch</div>
<div class="stage"><div class="insp">
  <div class="card-head"><i data-lucide="zap"></i>Triggers</div>
  <div class="body" id="body"></div>
</div></div>

<script>
// ---------- Two example triggers ----------
// Word kinds: t text, e entity, v value, n number, c choice.
const t = (x) => ({ k: 't', x }), e = (x) => ({ k: 'e', x }), v = (x) => ({ k: 'v', x }), n = (x) => ({ k: 'n', x }), c = (x) => ({ k: 'c', x });
// A component value shows its path from the entity: the component (and for a trigger's value, the trigger)
// dim, the value itself bright, so "set this Enabled" can't read as switching the whole entity off.
const path = (...parts) => v(parts.slice(0, -1).map((x) => `<span class="path">${x}</span><span class="path">›</span>`).join('') + parts.at(-1));
const ENABLED = path('Triggers', 'Timed door', 'Enabled'), POSITION = path('Transform', 'Position');

// The event's "other" is not a part you can change, but it is an entity, so it is blue like one.
const OTHER = t('<span class="fx">other</span>');

const TRIGGERS = [
  {
    name: 'Coin pickup', icon: 'hand', sum: 'Add 1 to coins, destroy this',
    when: { verb: 'Touch starts', words: [OTHER, c('starts'), t('touching'), e('this')], short: [OTHER, c('starts'), t('touching'), e('this')] },
    ifs: [{ icon: 'tag', verb: 'Has tag', words: [e('other'), c('has tag'), v('player')] }],
    dos: [
      { icon: 'plus', verb: 'Add', words: [t('Add'), n('1'), t('to'), v('coins')], fields: [['Change', 'add', true], ['Amount', '1'], ['Value', 'coins', true]] },
      { icon: 'trash-2', verb: 'Destroy', words: [t('Destroy'), e('this')], fields: [['Target', 'this', true]] },
    ],
    repeat: 'every time',
  },
  {
    name: 'Timed door', icon: 'radio', sum: 'Set Enabled to false, move up and back, wait 3 s, set Enabled to true',
    when: { verb: 'Custom event', words: [t('This gets'), v('open')], short: [t('Gets the event'), v('open')] },
    ifs: [],
    dos: [
      { icon: 'power-off', verb: 'Set', words: [t('Set'), e('this'), ENABLED, t('to'), c('false')], fields: [['Change', 'set', true], ['Target', 'this', true], ['Value', 'Triggers › Timed door › Enabled', true], ['To', 'false', true]] },
      { icon: 'move', verb: 'Set', words: [t('Set'), e('this'), POSITION, t('to'), n('0, -200')], fields: [['Change', 'set', true], ['Target', 'this', true], ['Value', 'Transform › Position', true], ['To', '0, -200']] },
      { icon: 'hourglass', verb: 'Wait', wait: true, words: [t('Wait'), n('2 s')], fields: [['For', '2 s']] },
      { icon: 'move', verb: 'Set', words: [t('Set'), e('this'), POSITION, t('to'), n('0, 0')], fields: [['Change', 'set', true], ['Target', 'this', true], ['Value', 'Transform › Position', true], ['To', '0, 0']] },
      { icon: 'hourglass', verb: 'Wait', wait: true, words: [t('Wait'), n('3 s')], fields: [['For', '3 s']] },
      { icon: 'power', verb: 'Set', words: [t('Set'), e('this'), ENABLED, t('to'), c('true')], fields: [['Change', 'set', true], ['Target', 'this', true], ['Value', 'Triggers › Timed door › Enabled', true], ['To', 'true', true]] },
    ],
    repeat: 'every time',
  },
];

// ---------- Shared pieces ----------
const ic = (name) => `<i data-lucide="${name}"></i>`;
const chipWords = (ws) => ws.map((w) => w.k === 't' ? `<span class="t">${w.x}</span>` : `<span class="chip ${w.k}">${w.x}</span>`).join('');
const chips = (ws) => `<span class="sent">${chipWords(ws)}</span>`;
const dotted = (ws) => ws.map((w) => w.k === 't' ? w.x : `<span class="w-dot">${w.x}</span>`).join(' ');
const hi = (ws) => ws.map((w) => w.k === 't' ? w.x : `<span class="w-hi">${w.x}</span>`).join(' ');
const lower = (ws) => ws.map((w, i) => i === 0 && w.k === 't' ? t(w.x[0].toLowerCase() + w.x.slice(1)) : w);
// The event as a sentence that starts with When, for the options that have no When label.
const whenWords = (tr) => [t('When'), ...lower(tr.when.words)];
const fields = (list) => `<div class="fields">${list.map(([lab, val, menu]) => `<div class="frow"><span class="lab">${lab}</span><span class="pill">${val}${menu ? '<span>▾</span>' : ''}</span></div>`).join('')}</div>`;
const head = (tr, withIcon = false) => `<div class="head">${withIcon ? `<span class="ev">${ic(tr.icon)}</span>` : ''}<span class="name">${tr.name}</span><span class="sw"></span><span class="icon-btn">${ic('ellipsis')}</span></div>`;
const foot = (tr, label = 'Add', withRepeat = true) => `<div class="foot"><span class="add">${ic('plus')} ${label}</span>${withRepeat ? `<span class="rep">${ic('repeat')} ${tr.repeat}</span>` : ''}</div>`;
const ADD_TRIGGER = `<div class="add-trigger">${ic('plus')} Add trigger</div>`;
const all = (fn) => TRIGGERS.map(fn).join('') + ADD_TRIGGER;

let openRow = '0:0';
let openFold = 0;

// Chips and a lane: used by option 2 and inside option 7.
function lanes(tr) {
  const lane = (cls, label, items, numbered) => `<div class="lane ${cls}"><span class="smallcaps">${label}</span><div class="stack">
    ${items.map((ws, i) => `<div class="sent">${numbered ? `<span class="num">${i + 1}</span>` : ''}${chipWords(ws)}</div>`).join('')}</div></div>`;
  return lane('when', 'When', [tr.when.words]) +
    (tr.ifs.length ? lane('if', 'If', tr.ifs.map((p) => p.words)) : '') +
    lane('do', 'Do', tr.dos.map((d) => d.words), true) + foot(tr);
}

// ---------- The options ----------
const OPTIONS = [
  {
    label: 'Now', caption: "Today's card, for comparison.",
    draw: () => all((tr) => `<div class="trig o-now">${head(tr)}
      <div class="sec"><div class="smallcaps">When<span>one event</span></div><div class="line">${dotted(tr.when.words)}</div></div>
      <div class="sec"><div class="smallcaps">If<span>all must be true</span></div>${tr.ifs.map((p) => `<div class="line">${dotted(p.words)}</div>`).join('')}<div class="addline">+ Add check</div></div>
      <div class="sec"><div class="smallcaps">Do<span>top to bottom</span></div>${tr.dos.map((d) => `<div class="line">${dotted(lower(d.words))}</div>`).join('')}<div class="addline">+ Add action</div></div>
      <div class="sec"><div class="smallcaps">Repeat</div><div class="line"><span class="w-dot">${tr.repeat}</span></div></div></div>`),
  },
  {
    label: 'Chips', caption: 'A lane for When, If and Do; each word you can change is a chip, coloured by what it is.',
    draw: () => all((tr) => `<div class="trig o-lane">${head(tr)}${lanes(tr)}</div>`),
  },
  {
    label: 'Icon rows', caption: 'Each part is an icon, a verb, and its details. Click a row to edit it.',
    draw: () => all((tr, ti) => {
      const row = (tile, icon, verb, ws, key, f) => {
        const isOpen = key === openRow;
        return `<div class="row ${isOpen ? 'open' : ''}" ${key ? `data-row="${key}"` : ''}><span class="tile ${tile}">${ic(icon)}</span>
          <div><div class="verb">${verb}</div><div class="args">${hi(ws)}</div></div>${isOpen && f ? fields(f) : ''}</div>`;
      };
      return `<div class="trig o-icons">${head(tr)}<div class="list">
        ${row('when', tr.icon, tr.when.verb, whenWords(tr))}
        ${tr.ifs.map((p) => row('if', p.icon, p.verb, p.words)).join('')}
        <div class="div"></div>
        ${tr.dos.map((d, i) => row(d.wait ? 'wait' : '', d.icon, d.verb, d.words.slice(1), `${ti}:${i}`, d.fields)).join('')}
      </div>${foot(tr)}</div>`;
    }),
  },
  {
    label: 'Blocks', caption: 'Soft blocks: the event on top, checks and actions stacked under it.',
    draw: () => all((tr) => `<div class="trig o-blocks">${head(tr)}<div class="stack">
      <div class="b when">${ic(tr.icon)}${chips(whenWords(tr))}</div>
      ${tr.ifs.map((p) => `<div class="b if">${ic('circle-help')}${chips([t('If'), ...p.words])}</div>`).join('')}
      ${tr.dos.map((d) => `<div class="b ${d.wait ? 'wait' : 'do'}">${ic(d.icon)}${chips(d.words)}</div>`).join('')}
    </div>${foot(tr)}</div>`),
  },
  {
    label: 'Flow', caption: 'A line from the event, through the check, to each action. A wait shows as a gap in time.',
    draw: () => all((tr) => `<div class="trig o-flow">${head(tr)}<div class="flow">
      <div class="node when"><span class="m"></span><span class="smallcaps">When</span>${hi(tr.when.words)}</div>
      ${tr.ifs.map((p) => `<div class="node if"><span class="m"></span><span class="smallcaps">Only if</span>${hi(p.words)}</div>`).join('')}
      ${tr.dos.map((d) => d.wait ? `<div class="later">${ic('hourglass')} ${d.words[1].x} later</div>` : `<div class="node"><span class="m"></span>${hi(d.words)}</div>`).join('')}
    </div>${foot(tr)}</div>`),
  },
  {
    label: 'Steps', caption: 'Plain lines with a quiet label in front. The calmest list.',
    draw: () => all((tr) => {
      const row = (cls, label, ws) => `<div class="row ${cls}"><span class="smallcaps">${label}</span><span>${hi(ws)}</span></div>`;
      return `<div class="trig o-steps">${head(tr)}<div class="list">
        ${row('when', 'When', tr.when.words)}
        ${tr.ifs.map((p, i) => row('', i ? '' : 'If', p.words)).join('')}
        <div class="space"></div>
        ${tr.dos.map((d, i) => row('', i ? '' : 'Do', d.words)).join('')}
      </div>${foot(tr)}</div>`;
    }),
  },
  {
    label: 'Folded', caption: 'One line per trigger. Click one to open it, drawn with chips.',
    draw: () => TRIGGERS.map((tr, i) => {
      const isOpen = i === openFold;
      return `<div class="o-fold"><div class="fold ${isOpen ? 'open' : ''}">
        <div class="line" data-fold="${i}"><span class="ev">${ic(tr.icon)}</span>
          <div class="txt"><div class="nm">${tr.name}</div><div class="sum">${tr.sum}</div></div>
          <span class="sw"></span>${ic(isOpen ? 'chevron-down' : 'chevron-right')}</div>
        ${isOpen ? `<div class="inside o-lane">${lanes(tr)}</div>` : ''}</div></div>`;
    }).join('') + ADD_TRIGGER,
  },
  {
    label: 'Sentence', caption: 'The whole trigger as one sentence; the parts you can change are soft pills.',
    draw: () => all((tr) => {
      const ws = [t('When'), ...lower([tr.when.words[0]]), ...tr.when.words.slice(1)];
      if (tr.ifs.length) ws.push(t(', if'), ...tr.ifs[0].words);
      tr.dos.forEach((d, i) => { ws.push(t(i === 0 ? ':' : i === tr.dos.length - 1 ? ', then' : ','), ...lower(d.words)); });
      ws.push(t('.'));
      const html = ws.map((w) => w.k === 't' ? w.x : `<span class="chip g">${w.x}</span>`).join(' ').replace(/ ([,:.])/g, '$1');
      return `<div class="trig o-sentence">${head(tr)}<div class="para">${html}</div></div>`;
    }),
  },
  {
    label: 'When / Then', caption: 'The event in one box, what happens in another.',
    draw: () => all((tr) => `<div class="trig o-wt">${head(tr)}
      <div class="box when"><span class="smallcaps">When</span><div class="item">${ic(tr.icon)}<span>${hi(tr.when.words)}</span></div>
        ${tr.ifs.map((p) => `<div class="cond">${ic('filter')}<span>only if ${hi(p.words)}</span></div>`).join('')}</div>
      <div class="arrow">${ic('arrow-down')}</div>
      <div class="box"><span class="smallcaps">Then</span>${tr.dos.map((d) => `<div class="item">${ic(d.icon)}<span>${hi(d.words)}</span></div>`).join('')}</div>
      ${foot(tr)}</div>`),
  },
  {
    label: 'Tree', caption: 'Like a file tree: the event is the root, and everything it does hangs under it.',
    draw: () => all((tr) => {
      const items = [
        ...tr.ifs.map((p) => `<span class="kw">if</span>${hi(p.words)}`),
        ...tr.dos.map((d) => d.wait ? `<span class="wait">${hi(d.words)}</span>` : hi(d.words)),
      ];
      return `<div class="trig o-tree">${head(tr)}<div class="tree">
        <div class="root">${ic(tr.icon)}<span>${hi(whenWords(tr))}</span></div>
        ${items.map((x, i) => `<div class="tn ${i === items.length - 1 ? 'last' : ''}">${x}</div>`).join('')}
      </div>${foot(tr)}</div>`;
    }),
  },
  {
    label: 'Branch', caption: 'Tree and Flow together: one line per part, each with its icon. Coloured words are the parts you can change.',
    draw: () => all((tr) => {
      const words = (ws) => ws.map((w) => w.k === 't' ? `<span class="t">${w.x}</span>` : `<span class="w ${w.k}">${w.x}</span>`).join(' ');
      // A Wait is a branch of its own: the actions after it hang under it, since they happen later.
      const kids = (dos) => {
        const out = [];
        for (let i = 0; i < dos.length; i++) {
          const d = dos[i];
          out.push({ cls: d.wait ? 'wait' : 'do', icon: d.icon, html: words(d.words), kids: d.wait ? kids(dos.slice(i + 1)) : null });
          if (d.wait) break;
        }
        return out;
      };
      const items = [...tr.ifs.map((p) => ({ cls: 'if', icon: 'filter', html: `<span class="kw">If</span> ${words(p.words)}` })), ...kids(tr.dos)];
      const branch = (list) => `<div class="kids">${list.map((k, i) => `<div class="kid ${k.cls} ${i === list.length - 1 ? 'last' : ''}">
        <div class="line">${ic(k.icon)}<span class="txt">${k.html}</span></div>${k.kids ? branch(k.kids) : ''}</div>`).join('')}</div>`;
      return `<div class="trig o-branch">${head(tr)}
        <div class="line root">${ic(tr.icon)}<span class="txt">${words(whenWords(tr))}</span></div>
        ${branch(items)}${foot(tr)}</div>`;
    }),
  },
  {
    label: 'Scratch', caption: 'Snap-together blocks in Scratch\'s colours: the event on top, If wraps the actions it guards, and every changeable part is its own little box.',
    draw: () => scratch(),
  },
];

// Snap-together blocks, slightly rounded.
function scratch() {
    return all((tr) => {
      const words = (ws) => ws.map((w, i) => {
        const x = i <= 1 ? w.x[0].toLowerCase() + w.x.slice(1) : w.x;
        if (w.k === 't') return `<span>${x}</span>`;
        return w.k === 'n' ? `<span class="sk-num">${x}</span>` : `<span class="sk-dd">${x}</span>`;
      }).join('');
      // Every block starts with one icon saying what it does. Only If holds other blocks: it wraps the
      // whole Do list, since its checks guard every action. A trigger has one If, its checks joined by "and".
      // Hovering the top half of a block opens the slot above it, the bottom half the slot below it
      // (owner, 2026-11-24). Every gap between blocks has one slot, keyed by a number; a block knows the
      // gap above it (data-above) and below it (data-below). The If is measured whole, its C included (owner,
      // 2026-11-24): hovering its top bar, arm or bottom bar, the top half of the C opens the slot above
      // the If, the bottom half the slot after it.
      const wrap = (icon, top, inner, z, above, below) => `<div class="sc" style="z-index: ${z}"><div class="sk ctl" data-above="${above}" data-below="${below}"><div class="sb ctl top"><i class="tooth"></i>${ic(icon)}${words(top)}</div></div>
           <div class="sc-mid"><div class="sc-arm" data-above="${above}" data-below="${below}"></div><div class="sc-inner">${inner}</div></div>
           <div class="sk ctl" data-above="${above}" data-below="${below}"><div class="sb ctl bottom end"><i class="tooth"></i></div></div></div>`;
      // A time's unit is a menu (seconds now, ticks later), not a fixed "s".
      const unit = c('seconds');
      const waitWords = (d) => [t('wait'), n(d.words[1].x.split(' ')[0]), unit];
      // Each block draws above everything after it: z-index counts down as the stack is written.
      let key = 0, z = 990;
      const block = (kind, html, above, below, end = false, cls = '') =>
        `<div class="sk ${kind}${cls}" style="z-index: ${z--}"${above === null ? '' : ` data-above="${above}"`} data-below="${below}"><div class="sb ${kind}${end ? ' end' : ''}"><i class="tooth"></i>${html}</div></div>`;
      const slot = (k, end) =>
        `<div class="sk slot" data-slot="${k}" style="z-index: ${z--}"><div class="sb slot${end ? ' end' : ''}"><i class="tooth"></i>${ic('plus')}<span>add a block</span></div></div>`;
      // A slot opens only on hover; the card has no other Add button (owner, 2026-11-24).
      const actions = (first) => {
        const last = tr.dos.length - 1;
        let above = first, html = '';
        tr.dos.forEach((d, i) => {
          const below = key++;
          const kinds = { move: ' k-motion', plus: ' k-var', 'trash-2': ' k-destroy', power: ' k-enabled', 'power-off': ' k-enabled' };
          const cat = kinds[d.icon] ?? '';
          html += slot(above, false)
            + block((d.wait ? 'wait' : 'do') + cat, ic(d.icon) + words(d.wait ? waitWords(d) : d.words), above, below, i === last, i === last ? ' last' : '');
          above = below;
        });
        return html + slot(above, true);
      };
      const checks = tr.ifs.flatMap((c, i) => i ? [t('and'), ...c.words] : c.words);
      const underHat = key++;
      const hat = block('hat', ic(tr.icon) + words([t('when'), ...(tr.ifs.length ? tr.when.short : tr.when.words)]), null, underHat);
      let body;
      if (tr.ifs.length) {
        const afterIf = key++;
        const before = slot(underHat, false), ifZ = z--;
        z = 900;
        body = before + wrap('split', [t('if'), ...checks], actions(key++), ifZ, underHat, afterIf) + slot(afterIf, true);
      } else {
        body = actions(underHat);
      }
      // No cooldown block: a trigger that must rest sets its Enabled to false, waits, and sets it to true.
      return `<div class="trig o-scratch">${head(tr)}<div class="script"><div class="room"></div><div class="stack">
        ${hat}${body}
      </div><div class="room"></div></div></div>`;
    });
}

// ---------- Page ----------
let current = 11;
function render() {
  openKey = null;
  document.getElementById('nav').innerHTML = OPTIONS.map((o, i) =>
    `<button class="${i === current ? 'on' : ''}" data-opt="${i}">${i === 9 ? 0 : i + 1} · ${o.label}</button>`).join('');
  document.getElementById('caption').textContent = OPTIONS[current].caption;
  document.getElementById('body').innerHTML = OPTIONS[current].draw();
  wantedSlot = activeScript = anchor = null;
  asked = { slot: null, script: null, at: 0 };
  // A Scratch script keeps the height it has with no slot open, so an opening slot scrolls it instead of growing it.
  document.querySelectorAll('.o-scratch .script').forEach((x) => { x.style.height = `${x.offsetHeight}px`; });
  lucide.createIcons();
}

// Scratch: a block has three bands (owner, 2026-11-24): its top third opens the slot above it, its bottom third the
// slot below it, and its middle third, where its values are, changes nothing: a slot already open next to the block
// stays open, any other closes. The If is measured whole, its C included; any other block without its tooth. The event
// block has no slot above, so its top third is like its middle. Hovering an open slot keeps it open. The block above an
// open slot shows its tooth. Keys are per trigger.
// Nothing moves for SLOT_DELAY_MS after the mouse asks for a change (owner, 2026-11-24), so a mouse passing over blocks
// doesn't push them. Then a slot takes about half a second: first the blocks move apart to make its room, then the
// slot fades in; closing runs the other way. Every move eases in and out (owner).
// A slot opening or closing above the hovered block would push it out from under the mouse, so the script (the box
// that also scrolls sideways) scrolls by the same amount on every frame: the hovered block, and the point of it under
// the mouse, stay where they were (owner, 2026-11-24). Once the mouse has left a script, it glides back to its start.
const SLOT_DELAY_MS = 250;
const SLOT_MOVE_MS = 300;
const SLOT_FADE_MS = 250;
const SETTLE_MS = 400; // how long a script the mouse left takes to scroll back to its start and drop its empty strips
const easeInOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (2 - 2 * x) ** 3 / 2);
const slotTime = new WeakMap(); // a slot → how far it is open, in ms, from 0 (closed) to SLOT_MOVE_MS + SLOT_FADE_MS
const slotHeight = new WeakMap(); // a slot → its full height
const settling = new WeakMap(); // a script gliding back → { start, scroll, rooms } it glides from
let asked = { slot: null, script: null, at: 0 }; // what the mouse asks for, and since when
let wantedSlot = null; // the slot open or opening: what was asked, once SLOT_DELAY_MS passed
let activeScript = null; // the script the mouse is on, once SLOT_DELAY_MS passed
let anchor = null; // the hovered block or slot, kept at anchorTop
let anchorTop = 0;
let framing = false;
let lastFrame = null;

document.addEventListener('mousemove', (ev) => {
  const trig = ev.target.closest('.o-scratch');
  let k = null;
  const slotEl = ev.target.closest('[data-slot]');
  const blockEl = ev.target.closest('[data-below]');
  if (slotEl) k = slotEl.dataset.slot;
  else if (blockEl) {
    const isIf = blockEl.matches('.sc > .sk, .sc-arm');
    const r = (isIf ? blockEl.closest('.sc') : blockEl.querySelector('.sb')).getBoundingClientRect();
    const third = Math.min(2, Math.floor((3 * (ev.clientY - r.top)) / (isIf ? r.height : r.height - 6)));
    const { above, below } = blockEl.dataset;
    const askedHere = asked.slot?.closest('.o-scratch') === trig ? asked.slot.dataset.slot : null;
    if (third <= 0 && above !== undefined) k = above;
    else if (third >= 2) k = below;
    else k = askedHere === above || askedHere === below ? askedHere : null;
  }
  const slot = trig && k !== null ? trig.querySelector(`[data-slot="${k}"]`) : null;
  const hovered = slotEl ?? blockEl;
  const script = hovered?.closest('.o-scratch .script') ?? null;
  if (slot !== asked.slot || script !== asked.script) asked = { slot, script, at: performance.now() };
  if (hovered !== anchor) {
    anchor = script ? hovered : null;
    anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
  }
  if (!framing) {
    framing = true;
    requestAnimationFrame(slotFrame);
  }
});

// Moves every slot one frame toward open or closed, then scrolls the hovered block's script to keep it in place and
// glides back the scripts the mouse has left.
function slotFrame(now) {
  const dt = lastFrame === null ? 16 : now - lastFrame;
  lastFrame = now;
  const waiting = asked.slot !== wantedSlot || asked.script !== activeScript;
  if (waiting && now - asked.at >= SLOT_DELAY_MS) ({ slot: wantedSlot, script: activeScript } = asked);
  let moving = asked.slot !== wantedSlot || asked.script !== activeScript;
  document.querySelectorAll('.o-scratch .sk.slot').forEach((slot) => {
    const t = slotTime.get(slot) ?? 0;
    const target = slot === wantedSlot ? SLOT_MOVE_MS + SLOT_FADE_MS : 0;
    if (t === target) return;
    const next = target > t ? Math.min(target, t + dt) : Math.max(target, t - dt);
    slotTime.set(slot, next);
    drawSlot(slot, next);
    moving ||= next !== target;
  });
  const kept = anchor?.isConnected && anchor.getClientRects().length > 0 ? anchor.closest('.script') : null;
  if (kept) keepInPlace(kept, anchor, anchorTop);
  document.querySelectorAll('.o-scratch .script').forEach((script) => {
    if (script === activeScript || script === kept) settling.delete(script);
    else moving = settle(script, now) || moving;
  });
  framing = moving;
  if (moving) requestAnimationFrame(slotFrame);
  else lastFrame = null;
}

// Glides a script the mouse has left back to its start over SETTLE_MS: no scroll, no empty strips. Returns whether
// it still has some way to go.
function settle(script, now) {
  const rooms = [...script.querySelectorAll(':scope > .room')];
  const heights = rooms.map((r) => parseFloat(r.style.height) || 0);
  if (!settling.has(script)) {
    if (script.scrollTop === 0 && heights.every((h) => h === 0)) return false;
    settling.set(script, { start: now, scroll: script.scrollTop, rooms: heights });
  }
  const from = settling.get(script);
  const left = 1 - easeInOut(Math.min(1, (now - from.start) / SETTLE_MS));
  rooms.forEach((r, i) => { r.style.height = `${from.rooms[i] * left}px`; });
  script.scrollTop = from.scroll * left;
  if (left > 0) return true;
  settling.delete(script);
  return false;
}

// Draws a slot `t` ms open: its room grows over SLOT_MOVE_MS, then it fades in over SLOT_FADE_MS, both eased.
function drawSlot(slot, t) {
  const sb = slot.firstElementChild;
  const opened = slot.closest('.o-scratch').querySelectorAll(`[data-below="${slot.dataset.slot}"]`);
  const fade = Math.max(0, Math.min(1, (t - SLOT_MOVE_MS) / SLOT_FADE_MS));
  opened.forEach((x) => x.classList.toggle('open', fade > 0));
  if (t === 0) {
    slot.classList.remove('show');
    slot.style.height = slot.style.overflow = sb.style.opacity = '';
    return;
  }
  slot.classList.add('show');
  if (!slotHeight.has(slot)) {
    slot.style.height = '';
    slotHeight.set(slot, slot.offsetHeight);
  }
  const grown = Math.min(1, t / SLOT_MOVE_MS);
  const eased = easeInOut(grown);
  slot.style.height = grown < 1 ? `${Math.round(slotHeight.get(slot) * eased)}px` : '';
  slot.style.overflow = grown < 1 ? 'hidden' : '';
  sb.style.opacity = String(easeInOut(fade));
}

// Scrolls the script so the anchor's top is back at `before`. When the script can't scroll that far, an empty
// .room strip above or below its blocks grows by what's missing; out of view, the strips shrink back.
function keepInPlace(script, anchor, before) {
  const [topRoom, bottomRoom] = script.querySelectorAll(':scope > .room');
  const setHeight = (room, h) => { room.style.height = `${h}px`; };
  const maxScroll = () => script.scrollHeight - script.clientHeight;
  const d = anchor.getBoundingClientRect().top - before;
  const shortBelow = script.scrollTop + d - maxScroll();
  if (d > 0 && shortBelow > 0) setHeight(bottomRoom, bottomRoom.offsetHeight + shortBelow);
  const shortAbove = -(script.scrollTop + d);
  if (d < 0 && shortAbove > 0) setHeight(topRoom, topRoom.offsetHeight + shortAbove);
  script.scrollTop += anchor.getBoundingClientRect().top - before;
  // The top strip shrinks by what is above the view, the script scrolling back by as much; the bottom strip by
  // what is below it.
  const hiddenTop = Math.min(topRoom.offsetHeight, script.scrollTop);
  setHeight(topRoom, topRoom.offsetHeight - hiddenTop);
  script.scrollTop -= hiddenTop;
  setHeight(bottomRoom, bottomRoom.offsetHeight - Math.min(bottomRoom.offsetHeight, maxScroll() - script.scrollTop));
}

document.addEventListener('click', (ev) => {
  const opt = ev.target.closest('[data-opt]');
  const row = ev.target.closest('[data-row]');
  const fold = ev.target.closest('[data-fold]');
  if (opt) current = +opt.dataset.opt;
  else if (row && !ev.target.closest('.fields')) openRow = openRow === row.dataset.row ? null : row.dataset.row;
  else if (fold) openFold = openFold === +fold.dataset.fold ? null : +fold.dataset.fold;
  else return;
  render();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') current = (current + 1) % OPTIONS.length;
  else if (ev.key === 'ArrowLeft') current = (current + OPTIONS.length - 1) % OPTIONS.length;
  else if (/^[0-9]$/.test(ev.key)) current = (Number(ev.key) + 9) % 10;
  else return;
  render();
});
render();
</script>
</body>
</html>
