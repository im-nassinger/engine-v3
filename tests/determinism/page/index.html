<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>engine-v3 determinism check</title>
        <style>
            body {
                margin: 16px;
                font-family: monospace;
                font-size: 14px;
            }
            table {
                border-collapse: collapse;
            }
            th,
            td {
                padding: 4px 8px;
                border: 1px solid #999;
                text-align: left;
            }
            [data-result='matches'] {
                color: #176b2c;
            }
            [data-result='differs'],
            [data-result='failed'] {
                color: #b3261e;
            }
        </style>
    </head>
    <body>
        <h1>Determinism check</h1>
        <p id="summary" data-state="running">Running…</p>
        <table aria-label="Levels">
            <thead>
                <tr>
                    <th>Level</th>
                    <th>Ticks</th>
                    <th>Last hash</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="levels"></tbody>
        </table>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
